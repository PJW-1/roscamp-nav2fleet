# 작업 4 Gazebo 비교: pd-plugin2 item8_overrides.yaml에서 shim 둘(4b, 새 a+c+d)만 남겼다.
# FollowPathRLShim = store_arena_4b, FollowPathRLShimACD2 = store_arena_acd2. shim 설정은 item 8과 같다.
controller_server:
  ros__parameters:
    controller_plugins:
    - FollowPath
    - FollowPathThrough
    - FollowPathReverse
    - FollowPathGoal
    - FollowPathMPPI
    - FollowPathRL
    - FollowPathRLShim
    - FollowPathRLShimACD2
    FollowPathRL:
      plugin: pode_rl_controller::FollowPathRL
      policy: store_arena_4b
      scan_topic: scan
      scan_timeout: 0.5
      transform_tolerance: 0.2
      intra_op_threads: 1
      rotate_gain: 1.5
      log_period: 1.0
      rear_stop_range: 0.0
      rear_half_width_deg: 30.0
    FollowPathRLShim:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: pode_rl_controller::FollowPathRL
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.39
      forward_sampling_distance: 0.15
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      policy: store_arena_4b
      scan_topic: scan
      scan_timeout: 0.5
      transform_tolerance: 0.2
      intra_op_threads: 1
      rotate_gain: 1.5
      log_period: 1.0
      rear_stop_range: 0.0
      rear_half_width_deg: 30.0
    FollowPathRLShimACD2:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: pode_rl_controller::FollowPathRL
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.39
      forward_sampling_distance: 0.15
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      policy: store_arena_acd2
      scan_topic: scan
      scan_timeout: 0.5
      transform_tolerance: 0.2
      intra_op_threads: 1
      rotate_gain: 1.5
      log_period: 1.0
      rear_stop_range: 0.0
      rear_half_width_deg: 30.0
