# 특징 지도(sim/fake_robots/maps/feature_map.yaml)에 맞춘 자유바닥 지도(실험, 비교용).
# 이미지 대신 사각형 바닥이다. 벽은 없고 지점 둘레를 0.3 m 이상 비운다.
# 좁은 양방향 통로 TUN(T1-T2)은 고정 선 둘로 둔다. 같은 칸을 쓰므로 선 전체를 한꺼번에
# 잡는 규칙이 통로 안에서 마주치지 않게 한다.
bounds: [0.05, 0.0, 2.75, 1.80]
resolution: 0.05
cell_m: 0.10
robot_radius_m: 0.08
cell_margin_m: 0.05
docks:
  WORK: [0.70, 1.325]
  OUTBOUND: [2.00, 1.325]
parking:
  - {id: P-1, x: 1.35, y: 0.25}
  - {id: P-2, x: 0.80, y: 0.25}
  - {id: P-3, x: 0.30, y: 0.40}
fixed_lines:
  work_in: [[0.60, 0.90], [0.70, 1.325]]
  work_out: [[0.70, 1.325], [1.00, 1.50]]
  outbound_in: [[2.40, 0.90], [2.00, 1.325]]
  outbound_out: [[2.00, 1.325], [1.70, 1.15]]
  tunnel_east: [[1.00, 0.60], [2.00, 0.40]]
  tunnel_west: [[2.00, 0.40], [1.00, 0.60]]
