# Free-floor map for the real arena (2026-11-09): 2.05 x 1.05 m with four objects, three Pinkys.
# The free floor is read from the arena map image. real_arena_fine.pgm is the same file as
# sim/fleet_gz_sim/maps/real_arena_fine.pgm (a test compares them; rebuild both with
# python3 -m fleet_gz_sim.arena --site real_arena). Coordinates are those of the lane map
# sim/fake_robots/maps/real_arena.yaml, which names this file in its floor_map key.
image: real_arena_fine.pgm
resolution: 0.01
origin: [-0.15, -0.15, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
# The gaps between the objects and the walls are 0.20-0.30 m, so a robot centre may come to
# robot_radius_m + wall_margin_m (0.09 m) of a wall or an object. The cells are 3 cm: with 5 cm
# cells no cell of the 0.25 m gap between block_long and box_small was clear.
# A robot locks robot_radius_m + cell_margin_m (0.11 m) around it, against 0.13 m elsewhere: the
# floor is too small for bigger locks, so the robots run slower (fleet_params_real_arena.yaml,
# nav_max_speed 0.15 m/s). With 3 cm cells that locks about 520 cm2, less than 0.10 m did with
# 5 cm cells; 2 cm failed headless runs with 3 cm report noise at the start (2 of 6 seeds).
# The 3 cm margin is still below the AMCL error the warehouse sims measured (p95 0.08-0.10 m),
# so two robots side by side can touch when both reports are off.
cell_m: 0.03
robot_radius_m: 0.08  # same as fleet_params.yaml
cell_margin_m: 0.03   # floor_map.yaml has 0.05
# Pinky drives differentially and never sideways: on a straight stretch a robot locks only its
# half width + cell_margin_m (0.09 m) around itself and half width + side_margin_m (0.08 m)
# beside the line ahead, run on past each end far enough to hold the square's corners. Where
# RPP may turn it in place (the start and end of a leg, and from 0.25 m before a turn sharper
# than 0.25 rad) it locks the whole 0.11 m circle. Half of the Nav2 footprint (pinky_nav_config nav2_params.yaml, a 12 cm square).
robot_half_width_m: 0.06
# 0.02 (user, 2026-11-10; was cell_margin_m 0.03): the side cells looked too wide in RViz.
# 0.01 failed the headless arena seeds with report noise (a true body over a cell not held);
# 0.02 passes them. Bands of two robots on parallel lines keep the lines 0.16 m apart.
side_margin_m: 0.02
wall_margin_m: 0.01
# Station dock poses: the dock waypoints of the lane map (a test compares them).
docks:
  WORK: [0.25, 0.50]
  OUTBOUND: [1.875, 0.25]
# Parking spots in driving order (lane map parking). P-3 sits south of bin, off every line.
parking:
  - {id: P-3, x: 0.60, y: 0.45}
  - {id: P-1, x: 0.925, y: 0.20}
  - {id: P-2, x: 0.575, y: 0.15}
# WORK: in from the south (QW), out to the north (WN). OUTBOUND is a one-way loop: in along the
# north wall and through the 0.25 m gap north of box_small; out south of table_2, up the middle
# and through the 0.25 m gap between block_long and box_small to between bin and block_long (PS).
# Every line is one way and the way in and the way out share only the dock end, so no robot
# meets another head-on on a line: the lines roll like the floor (rolling_lines). A robot locks
# floor_lock_ahead_m ahead on a line too, and the next robot queues on the line behind it.
# The way out stops short of the parking spots, so a parked robot never holds one of its cells.
fixed_lines:
  work_in: [[0.25, 0.20], [0.25, 0.50]]
  work_out: [[0.25, 0.50], [0.25, 0.925]]
  outbound_in: [[1.20, 0.925], [1.875, 0.925], [1.875, 0.25]]
  outbound_out: [[1.875, 0.25], [1.80, 0.165], [1.35, 0.165], [1.35, 0.45], [1.275, 0.525],
                 [1.275, 0.555], [1.245, 0.585], [1.245, 0.615], [0.96, 0.615], [0.90, 0.575]]
rolling_lines: [work_in, work_out, outbound_in, outbound_out]
