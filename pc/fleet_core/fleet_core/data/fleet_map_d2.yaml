# 배치 D2: 북쪽 벽 급행 + 넓은 마당 (개발 기본, 지시서 5절). 벽 안쪽 1.98 x 0.99 m.
# 진열대는 사용자 결정(2026-11-12)으로 x 0.50~1.48이다: 0.45~1.53이면 갈림목 선(x 0.40)을 달리는
# 로봇의 몸(x 0.46까지)과 진열대 끝이 1 cm밖에 떨어지지 않았다.
#
#   y
#  0.99 +--------+------+---------------------------+------+--------+
#       |   W    | X_W  |          EXPRESS          | X_E  |   O    |  급행 중심선 y 0.89
#  0.79 +--------+------+===========================+------+--------+  진열대 y 0.775~0.79
#       |              N_W                           N_E            |  y 0.65
#       |     W_Q                  HALL                     O_Q     |  y 0.55
#       |                                                           |
#       |   P-1      P-2                                    P-3     |  y 0.15
#  0    +-----------------------------------------------------------+
#       0  0.18 0.30 0.40 0.50                  1.48 1.58 1.68 1.80  1.98  x
#
# 구역: HALL은 Nav2 goal로 다니는 마당이고, 북쪽 띠의 다섯 구역은 고정 경로(FollowPath)로만 다닌다.
# HALL에는 진열대 양 끝 옆의 1.5 cm 띠(y 0.775~0.79)도 넣어 구역 사이에 빈 틈이 없게 했다.
name: arena_d2
bounds: [0.0, 0.0, 1.98, 0.99]
shelves:
  - [0.50, 0.775, 1.48, 0.79]
zones:
  HALL:
    kind: shared
    capacity: 3
    rects: [[0.0, 0.0, 1.98, 0.775], [0.0, 0.775, 0.50, 0.79], [1.48, 0.775, 1.98, 0.79]]
  WORK_DOCK: {kind: dock, rects: [[0.0, 0.79, 0.30, 0.99]]}
  J_W: {kind: dock, rects: [[0.30, 0.79, 0.50, 0.99]]}        # 갈림목, 한 대
  EXPRESS: {kind: lane, capacity: 2, rects: [[0.50, 0.79, 1.48, 0.99]]}
  J_E: {kind: dock, rects: [[1.48, 0.79, 1.68, 0.99]]}        # 갈림목, 한 대
  OUT_DOCK: {kind: dock, rects: [[1.68, 0.79, 1.98, 0.99]]}
nodes:
  W: {x: 0.18, y: 0.89, kind: dock, yaw_deg: 180}      # 작업 도크, 서쪽 벽을 본다
  O: {x: 1.80, y: 0.89, kind: dock, yaw_deg: 0}        # 출고 도크, 동쪽 벽을 본다
  X_W: {x: 0.40, y: 0.89, kind: pass}                  # 서쪽 갈림목 안
  X_E: {x: 1.58, y: 0.89, kind: pass}                  # 동쪽 갈림목 안
  N_W: {x: 0.40, y: 0.65, kind: fork}                  # 작업 도크 진입 시작점
  N_E: {x: 1.58, y: 0.65, kind: fork}                  # 출고 도크 진입 시작점
  W_Q: {x: 0.20, y: 0.55, kind: wait, yaw_deg: 90}     # 작업 도크 대기 자리
  O_Q: {x: 1.78, y: 0.55, kind: wait, yaw_deg: 90}     # 출고 도크 대기 자리
  P-1: {x: 0.13, y: 0.15, kind: parking, yaw_deg: 90}
  P-2: {x: 0.38, y: 0.15, kind: parking, yaw_deg: 90}
  P-3: {x: 1.85, y: 0.15, kind: parking, yaw_deg: 90}
paths:  # 고정 경로(FollowPath 선). 이웃한 두 점마다 연결 하나가 된다
  work_in: {points: [N_W, X_W, W]}
  work_out: {points: [W, X_W], reverse: true}          # 후진(Retreat)으로 나온다
  out_in: {points: [N_E, X_E, O]}
  out_out: {points: [O, X_E], reverse: true}
  express: {points: [X_W, X_E], two_way: true}         # 급행: 한 번에 한 방향
  j_w_down: {points: [X_W, N_W]}                       # 갈림목에서 마당으로
  j_e_down: {points: [X_E, N_E]}
nav:  # 이 지점들은 서로 Nav2 goal로 오간다
  - {nodes: [N_W, N_E, W_Q, O_Q, P-1, P-2, P-3]}
stations:
  WORK: {dock: W, queue: [W_Q], server: workcell, arms: [arm1, arm2], action: fill}
  OUTBOUND: {dock: O, queue: [O_Q], server: arm3, arms: [arm3], action: swap}
parking: [P-1, P-2, P-3]
