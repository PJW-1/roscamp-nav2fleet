# 정책 값. 추정 표시는 실제 코스에서 재야 한다.
basket_capacity: 4            # 추정: 바구니 하나에 담는 최대 수량, 실제 바구니에 따라 다름
ship_partial: true            # 일부만 담겨도 내보내고, 빈 바구니는 남긴다
robot_radius_m: 0.08          # 추정: 핑키 몸체만, 뒤 트레이는 아직 미포함
release_margin_extra_m: 0.05  # 시나리오 판정 전용: 반경 + 이 값 = 코스 이탈
# 경로 위에서 뒤 구역은 보고가 나가는 레인을 따라 이만큼 지나면 놓는다. s = (p - p_i)·u.
# 규칙 d >= r + eps + v * (tau + tick): 보고가 eps 틀리고 tau + tick 늦어도 몸이 구역을 지난다.
# 0.08 + 0.03 + 0.2 * (0.2 + 0.1) = 0.17 m.
# 또 d > 2r: 뒤 로봇이 방금 떠난 지점까지 올 수 있다. 앞 로봇이 eps 앞선 보고 직후 멈출 수
# 있으면 d >= 2r + eps. eps와 tau를 실제 로봇에서 재기 전까지 추정이다.
# 압박 표는 docs/worklog_2026-11-05.md.
release_distance_m: 0.2
release_confirm_samples: 3    # 해제 전에 그 거리를 지난 연속 보고 수
lane_error_warn_m: 0.15       # 가짜 로봇: 받은 path 첫 점이 이보다 멀면 따라가지 않는다(PATH_NOT_CONNECTED). 레인 이탈 감시는 지웠다
move_retry_limit: 2           # 첫 실패 뒤 재시도 수, 모두 세 번 시도
move_retry_wait_s: 2.0        # 추정: 세 번 시도가 comm_timeout_s보다 길어 통신 끊김이 먼저 보인다
stall_s: 6.0                  # 목표가 열린 채 이만큼 제자리면 멈춤. pinky_multi_sim과 같은 값
stall_move_m: 0.05            # 매끄럽게 한 위치가 이보다 덜 움직이면 제자리. 위치 잡음 σ 0.03 m에도 버틴다
stall_smooth_s: 1.0           # 위치를 매끄럽게 하는 시간 상수(지수 평균)
dock_stall_s: 15.0            # 추정: 도킹은 천천히 맞추므로 더 길게 본다
blocked_mark_s: 10.0          # 추정: BLOCKED가 이만큼 이어지면 그 연결을 막힘으로 표시하고 다른 길을 고른다(잠깐 지나가는 사람 8 s보다 길게)
blocked_timeout_s: 60.0       # 추정: BLOCKED로 보고된 시간이 이만큼이면 ERROR(BLOCKED)
blocked_rejoin_s: 10.0        # 풀린 뒤 이 안에 같은 레인에서 다시 막히면 막힌 시간을 이어 센다
queue_gap_m: 0.6              # 추정: 같은 레인이나 다음 레인 앞 이 거리 안에 정상 로봇이 있으면 줄 서기
arrival_tolerance_m: 0.15     # 추정: 목표 지점에 이만큼 가까워야 이동 성공으로 친다
arrival_settle_s: 1.0         # 추정: 보고가 늦으니 성공 뒤 이만큼 기다린다
startup_wait_s: 10.0          # 이때까지 보고 없는 로봇은 알린다
comm_timeout_s: 3.0           # 추정
heartbeat_period_s: 0.5       # /fleet/heartbeat 제안값. 프로세스를 보므로 실제 시계 기준
heartbeat_timeout_s: 1.5      # 제안값: 이만큼(세 번) 못 받으면 로봇이 멈춘다
recover_check_s: 1.0          # 추정
arm_cancel_wait_s: 5.0        # 추정
arm_retry_wait_s: 2.0         # 추정
fill_timeout_s: 90.0          # 추정: 팔 두 대가 바구니 하나를 채움
swap_timeout_s: 60.0          # 추정: arm3가 찬 바구니를 빼고 빈 바구니를 놓음
cancel_retry_s: 1.0           # 추정: 취소한 goal 결과가 없으면 이 주기로 다시 요청
cancel_warn_after: 5          # 결과 없이 이만큼 주기가 지나면 CANCEL_UNCONFIRMED.
                              # 코어가 기다리는 팔을 늦었다고 하지 않게 arm_cancel_wait_s 이상
report_retry_s: 2.0           # 추정: 답이 없으면 이만큼 뒤 주문 보고를 다시 보냄
zone_wait_warn_s: 60.0        # 한 구역을 이만큼 기다리면 경고
deadlock_grace_s: 5.0         # 교착 두 번째 단계 전 대기
deadlock_unresolved_s: 30.0   # 제안: DEADLOCK_UNRESOLVED 뒤 같은 순환이 이만큼 이어지면 우선순위가 가장 낮은 로봇을 격리
score_same_call: -4.0         # 이미 불린 로봇은 다른 로봇이 확실히 가깝지 않으면 호출을 유지
score_distance_weight: 0.91   # 레인 거리 1 m당
priority_at_station: 200
priority_has_cargo: 100
input_pose_margin_m: 1.0      # 웨이포인트 범위 밖으로 이보다 먼 보고 위치는 버린다
idle_watch_s: 10.0            # 제안: 주행 단계인데 goal도 구역 대기표도 없이 이만큼 서면 ROBOT_IDLE, 그 지점 goal을 다시 보낸다
battery_low_pct: 0.0          # 제안: 보고한 배터리(0-100)가 이 값 이하면 새 일을 받지 않고 대기 지점(충전 자리)으로 간다. 0이면 끈다
battery_charged_pct: 80.0     # 제안: 이 값 이상이 되면 다시 일을 받는다
dispatch_retry_wait_s: 2.0    # 제안: 출고 호출이 실패하면 이만큼 뒤 다시 보낸다
dispatch_retry_limit: 3       # 제안: 출고 호출 실패가 이 수를 넘으면 ERROR(DISPATCH_FAILED)
mark_final_goal: true         # 제안(버전 2 4절, 계약 0.8-draft): 잠금 경계에서 끝나는 이동은 final_goal 거짓(핑키가 설 수 있는 속도로만 줄인다).
self_recovery_limit_s: 45.0   # 제안: 로봇이 RECOVERING(자가 복구)을 이만큼 넘게 이어 보내면 BLOCKED로 본다. 핑키 FSM의 두 번 시도는 길어야 약 35 s
traffic_mode: zones           # 교통 층: zones(지점·구역 그래프의 구역 허락, 3단계에서 만든다). 다른 값은 없다
eta_speed_mps: 0.2            # 추정(버전 2 ETA): ETA에 쓰는 평균 속도
eta_turn_s_per_rad: 1.0       # 추정: 제자리 회전 시간(초/rad). RPP rotate_to_heading_angular_vel 1.0
eta_turn_min_rad: 0.25        # 추정: 이보다 작은 꺾임은 달리면서 지난다(RPP rotate_to_heading_min_angle)
eta_dock_s: 3.0               # 추정: 도킹 시간(가짜 시나리오 기본값)
eta_fill_s_per_item: 4.0      # 추정: 채우기 품목당 팔 시간(가짜 시나리오 기본값)
eta_fill_base_s: 4.0          # 추정: 첫 품목 전 준비 시간. 가짜 팔은 채우기에 품목 수 + 1번의 팔 시간이 걸린다(SimWorld 측정)
eta_fill_items_default: 2     # 추정: 주문을 아직 모르는 로봇이 채울 품목 수
eta_swap_s: 8.0               # 추정: 교환 시간(가짜 시나리오 기본값)
floor_leave_s: 2.5            # 추정: 도크를 떠나기 시작해서 접근선이 빌 때까지(SimWorld 측정)
floor_dock_schedule: false    # 제안: 켜면 접근선 순서를 ETA로 정하고, 앞 로봇이 비울 때에 맞춰 다음 로봇을 미리 출발시킨다
floor_pre_admit_margin_s: 1.0 # 제안: 딱 맞는 때보다 이만큼 먼저 출발시킨다
floor_dock_aging_s: 30.0      # 제안: 이만큼 기다린 로봇은 다시 먼저 온 순서로 앞에 둔다(굶김 방지)
floor_block_retreat: false    # 제안: 켜면 막혀(BLOCKED) 오래 선 로봇을 Retreat로 물러나게 한다
floor_retreat_after_s: 10.0   # 제안: 이만큼 막혀 서 있으면 물러난다
floor_retreat_speed_mps: 0.05 # 제안: 물러나는(후진) 속도
floor_retreat_max_m: 1.0      # 제안: 한 번에 물러나는 가장 긴 거리
# 구역 교통 층(traffic/zone). 모두 제안값이고 실측 전이다
nav_speed_mps: 0.12           # 넓은 구역(Nav2 goal)의 ETA와 길 비용에 쓰는 속도
follow_speed_mps: 0.12        # 고정 경로(FollowPath)의 같은 값
retreat_speed_mps: 0.05       # 후진(Retreat) 속도
zone_clear_m: 0.10            # 보고 위치가 뒤 구역에서 이만큼 벗어나면 그 구역을 놓는다(몸 반 길이 0.06 + 여유)
node_clear_m: 0.20            # 뒤 지점에서 이만큼 멀어지면 그 지점을 놓는다
lane_follow_gap_s: 4.0        # 앞 로봇이 한 줄 구역에 들어간 뒤 이만큼 지나야 같은 방향으로 뒤따른다
lane_hysteresis_s: 5.0        # 반대쪽이 입구에 이만큼 더 빨리 닿을 때만 방향을 바꾼다
lane_handover_s: 30.0         # 이만큼 기다린 쪽에 방향을 넘긴다
dock_wait_estimate_s: 30.0    # 찬 도크를 기다리는 예상 시간(길 비용)
blocked_retry_s: 60.0         # 막힘으로 표시한 연결을 이만큼 뒤 다시 써 본다
near_m: 0.30                  # 넓은 구역에서 두 로봇이 이만큼 가까이
near_stuck_s: 5.0             # 이만큼 못 나아가면 우선순위 낮은 쪽이 비킨다
outside_zone_m: 0.05          # 쥔 구역 밖으로 이만큼 벗어난 보고가
outside_zone_samples: 5       # 이만큼 이어지면 OUTSIDE_ZONE(기록만)
use_order_model: false        # order 모델(base/horizon, 이어 붙이기). 끄면 조각 하나씩 보낸다
lookahead_s: 2.0              # order 모델: base 끝까지 이만큼 남으면 다음 구역을 잡아 본다
comm_base_hold_extra_s: 3.0   # order 모델: 끊긴 로봇의 base 구역을 base 끝 ETA + 이만큼 쥔다
