# 배치 v7: 사용자가 확정한 경기장(2026-11-13, 스케치 그림 v8 뒤 진열대를 x 0.68~1.56으로 내림).
# 실물로 놓아 본 적 없는 가정이다. 벽 안쪽 1.98 x 0.99 m. 치수 출처: 자유바닥 저장소 sites/arena_v7.yaml.
# 진열대 셋(두께 0.04): 북쪽 긴 것 y 0.77~0.81, 남쪽 둘 y 0.365~0.405(사이 건넘 틈 0.26).
# 충전 칸막이 셋은 남쪽 벽에 붙고 shelves에 넣는다(월드, 지도, 여유 검사가 함께 본다).
# 칸 빈 폭 0.24는 잠정값이다(그림은 0.20).
#
#   y
#  0.99 +---------------+---------------------------------+----------+
#       |   O  OUT_DOCK |            EXPRESS  <-----------|  X_E J_E |  급행 가운데 y 0.90
#  0.81 |               |  +==============================+          |  진열대 y 0.77~0.81
#  0.765+------+        |  |                              |   HALL_E |
#       |  N_O   HALL_W    |           MID                |  N_E     |  y 0.58
#       | O_Q              |                              |     | W  |  WORK y 0.495, 북쪽 보기
#  0.405|                  +=========+   틈   +===========+     |    |  진열대 y 0.365~0.405
#       |    S_W                         SOUTH                Q1     |  y 0.255
#       | P-1 | P-2 | P-3 |                                  Q2      |  y 0.10~0.11
#  0    +-----+-----+-----+--------------------------------------------+
#       0    0.25  0.51  0.77                                 1.50  1.78  1.98  x
#
# 흐름: 충전 칸 -> 남쪽 또는 가운데 통로(Nav2 goal, 양방향, 한 대씩) -> 대기 L -> WORK(고정 경로)
#       -> 북쪽으로 나가 급행(고정 경로) -> OUTBOUND -> 후진으로 마당에 나옴 -> 충전 칸 또는 다시 일.
# 서는 지점(대기, 주차, 갈림)은 다른 구역에서 0.135(몸 반경 0.085 + 놓기 여유 0.05) 이상 떨어뜨렸다:
# 선 로봇이 이웃 구역을 쥐지 않는다. 지점끼리는 node_clear_m 0.20 이상이다.
name: arena_v7
bounds: [0.0, 0.0, 1.98, 0.99]
shelves:
  - [0.68, 0.77, 1.56, 0.81]     # 북쪽 긴 진열대(급행 남쪽)
  - [0.68, 0.365, 0.99, 0.405]   # 남쪽 진열대, 서쪽
  - [1.25, 0.365, 1.56, 0.405]   # 남쪽 진열대, 동쪽
  - [0.24, 0.0, 0.26, 0.10]      # 충전 칸막이
  - [0.50, 0.0, 0.52, 0.10]
  - [0.76, 0.0, 0.78, 0.10]
zones:
  # 서쪽 넓은 곳: 충전 칸, 출고 대기, 두 통로의 서쪽 입구
  HALL_W:
    kind: shared
    capacity: 3
    rects: [[0.0, 0.0, 0.78, 0.365], [0.0, 0.365, 0.68, 0.765], [0.50, 0.765, 0.68, 0.81]]
  # 가운데 통로(0.365)와 건넘 틈. 두 대가 비켜 갈 수 없어 한 대씩
  MID: {kind: shared, capacity: 1, rects: [[0.68, 0.405, 1.50, 0.77], [0.99, 0.365, 1.25, 0.405]]}
  # 남쪽 통로(0.365). 동쪽 끝 x 1.50, 서쪽 끝은 셋째 칸막이(x 0.78): P-3이 이 구역을 쥐지 않게
  SOUTH: {kind: shared, capacity: 1, rects: [[0.78, 0.0, 1.50, 0.365]]}
  # 동쪽 넓은 곳: 가운데 통로 동쪽 입구, WORK 북쪽 띠
  HALL_E:
    kind: shared
    capacity: 2
    rects: [[1.50, 0.36, 1.78, 0.77], [1.78, 0.63, 1.98, 0.77]]
  # WORK 대기 L(남쪽 벽에서 0.10, 동쪽 벽 x 1.88)
  QUEUE:
    kind: shared
    capacity: 2
    rects: [[1.50, 0.0, 1.98, 0.36], [1.78, 0.36, 1.98, 0.395]]
  # 서쪽 경계는 W에서 0.10: 도킹을 마친 로봇이 HALL_E를 놓는다(0.085 + 오차 0.01)
  WORK_DOCK: {kind: dock, rects: [[1.78, 0.395, 1.98, 0.63]]}
  J_E: {kind: dock, rects: [[1.56, 0.77, 1.98, 0.99]]}             # 급행 동쪽 입구, 한 대
  EXPRESS: {kind: lane, capacity: 2, rects: [[0.50, 0.81, 1.56, 0.99]]}
  OUT_DOCK: {kind: dock, rects: [[0.0, 0.765, 0.50, 0.99]]}
nodes:
  W: {x: 1.88, y: 0.495, kind: dock, yaw_deg: 90}      # WORK, 남쪽에서 들어가 북쪽을 본다
  O: {x: 0.285, y: 0.90, kind: dock, yaw_deg: 180}     # OUTBOUND, 급행 서쪽 끝, 서쪽을 본다
  X_E: {x: 1.84, y: 0.86, kind: pass}                  # 급행 입구(J_E 안)
  N_E: {x: 1.64, y: 0.58, kind: fork}                  # 가운데 통로 동쪽 입구
  N_O: {x: 0.42, y: 0.62, kind: fork}                  # 가운데 통로 서쪽 입구, 출고 진입 시작점
  S_W: {x: 0.56, y: 0.30, kind: fork}                  # 남쪽 통로 서쪽 입구
  # WORK 대기 L: 첫 자리는 동쪽 벽 선 위(W에서 0.24), 둘째는 남쪽 벽 선 위. 모서리(1.88, 0.10)는
  # 첫 자리와 0.155라 node_clear_m 0.20보다 가까워 자리로 두지 않았다
  Q1: {x: 1.88, y: 0.255, kind: wait, yaw_deg: 90}
  Q2: {x: 1.655, y: 0.10, kind: wait, yaw_deg: 0}
  O_Q: {x: 0.15, y: 0.55, kind: wait, yaw_deg: 90}     # 출고 대기 자리
  # 충전 칸. y는 자료의 0.09보다 0.02 북쪽: 칸 안 제자리 회전(뒤 모서리 반경 0.083)이 남쪽 벽에서
  # 0.7 cm가 아니라 2.7 cm 떨어진다. 칸막이(길이 0.10) 안에 몸 뒤쪽이 든다
  P-1: {x: 0.12, y: 0.11, kind: parking, yaw_deg: 90}
  P-2: {x: 0.38, y: 0.11, kind: parking, yaw_deg: 90}
  P-3: {x: 0.64, y: 0.11, kind: parking, yaw_deg: 90}
paths:  # 고정 경로(FollowPath 선). [x, y]는 꺾는 점
  work_in: {points: [Q1, W]}                           # 대기 첫 자리에서 북쪽으로 곧게 0.24
  work_out: {points: [W, X_E]}                         # 앞으로 북쪽으로 나간다
  # 급행: 출고로 갈 때만, 서쪽으로 한 방향. 꺾는 점은 진열대 모서리에서 0.166
  express: {points: [X_E, [1.70, 0.90], O]}
  j_e_down: {points: [X_E, N_E]}                       # 급행이 막히면 넓은 곳으로
  # 넓은 곳에서 출고로(급행이 막혔을 때)와 출고에서 나오는 후진. 꺾는 점은 OUT_DOCK 안
  out_in: {points: [N_O, [0.40, 0.90], O]}
  out_out: {points: [O, [0.40, 0.90], N_O], reverse: true}
nav:  # Nav2 goal 이음
  - {nodes: [N_O, S_W, O_Q, P-1, P-2, P-3]}            # 서쪽 넓은 곳 안
  - {nodes: [N_E, Q1, Q2]}                             # 동쪽(가운데 통로 끝에서 대기 L로 내려감)
  - {nodes: [N_O, N_E], zones: [HALL_W, MID, HALL_E]}  # 가운데 통로, 양방향
  - {nodes: [S_W, Q2], zones: [HALL_W, SOUTH, QUEUE]}  # 남쪽 통로, 양방향
stations:
  WORK: {dock: W, queue: [Q1, Q2], server: workcell, arms: [arm1, arm2], action: fill}
  OUTBOUND: {dock: O, queue: [O_Q], server: arm3, arms: [arm3], action: swap}
parking: [P-1, P-2, P-3]
