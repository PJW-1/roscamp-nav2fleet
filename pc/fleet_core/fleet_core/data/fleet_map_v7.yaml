# 배치 v7: 사용자가 확정한 경기장(2026-11-13, 스케치 그림 v8 뒤 진열대를 x 0.68~1.56으로 내림).
# 실물로 놓아 본 적 없는 가정이다. 벽 안쪽 1.98 x 0.99 m. 치수 출처: 자유바닥 저장소 sites/arena_v7.yaml.
# 진열대 셋(두께 0.04): 북쪽 긴 것 y 0.77~0.81, 남쪽 둘 y 0.365~0.405(사이 건넘 틈 0.26).
# 충전 칸막이 셋은 남쪽 벽에 붙고 shelves에 넣는다(월드, 지도, 여유 검사가 함께 본다).
# 칸 빈 폭 0.24는 잠정값이다(그림은 0.20).
#
#   y
#  0.99 +---------------+---------------------------------+----------+
#       |   O  OUT_DOCK | O_X        EXPRESS  <-----------|      J_E |  급행 가운데 y 0.90, O_X 급행 서쪽 끝 대기
#  0.81 |               |  +==============================+          |  진열대 y 0.77~0.81
#  0.765+------+        |  |                              |     W_X  |  y 0.80, 급행 들머리
#       | O_OUT    O_IN            가운데 통로                   M_E    |  y 0.62 출고의 두 점, M_E y 0.55
#       |                                                         [W]|  WORK y 0.495, 북쪽 보기
#  0.405|                  +=========+   틈   +===========+          |  진열대 y 0.365~0.405
#       | E-1   E-2   E-3          남쪽 통로                       Q1 |  y 0.24~0.26, 칸 입구와 줄 앞자리
#       | P-1 | P-2 | P-3 |                                Q2  -^    |  y 0.10 충전 칸, y 0.16 줄 입구
#  0    +-----+-----+-----+--------------------------------------------+
#       0    0.25  0.51  0.77                                 1.56  1.78  1.98  x
#
# 구역(사용자 결정 2026-11-13): 잠그는 것은 급행 띠(EXPRESS, 입구 J_E)와 도크 자리(WORK_DOCK,
# OUT_DOCK)뿐이다. HALL은 나머지 바닥 전부다(진열대와 칸막이 자리도 덮는다. 그 자리에는 지점과
# 길이 없다). 로봇끼리는 Nav2가 피한다: v7은 관제가 주는 다른 로봇 위치(peer_obstacles)를 켜야
# 한다(실물 nav2.launch.py의 기본값은 false). 통로마다 정원 1 구역을 두었던 첫 판은 한 이동에
# 구역 다섯을 잡았고, 격리된 로봇이 남쪽 통로를 쥔 채 길이 잠겼다(Gazebo 1판).
# 지점 줄이기(사용자 결정 2026-11-13 밤): 가운데 통로의 두 끝 N_O, N_E와 출고 대기 O_Q, 줄 꼬리 Q3을
# 없앴다. 그 전에는 서쪽에서 WORK 줄로 가는 이음이 N_O -> N_E -> G 하나뿐이라 모든 로봇이 가운데
# 통로로 돌았다. N_E가 없으니 그것만 잇던 갈림 G와 W에서 넓은 곳으로 바로 나가던 고정 경로도 없다
# (2026-11-14부터 W에서 넓은 곳으로는 Nav2 goal로 M_E에 풀려 나간다: nav의 W -> M_E).
# 가운데 통로는 우회로로만 남긴다(M_E): 남쪽 통로가 막혔다고 표시되거나 칸 입구가 모두 잡혀 있을 때
# O_IN -> M_E -> Q2로 돈다. 평소에는 남쪽 통로가 0.6 m쯤 짧아 그쪽으로 간다.
# 흐름: 충전 칸 -> 입구 E -> 남쪽 통로(Nav2 goal) -> 줄 입구 Q2 -> 앞자리 Q1 -> WORK(고정 경로)
#       -> 북쪽 W_X -> 급행(고정 경로) -> O_X -> OUTBOUND -> 앞으로 서쪽, 남쪽으로 꺾어 O_OUT(고정 경로)
#       (출고가 바쁘면 급행 서쪽 끝 O_X에서 기다렸다 비면 들어간다. O_X를 다른 로봇이 쥐고 있거나 급행이
#       막혔다고 표시되거나 들머리 J_E가 잡혀 있으면 W -> M_E(Nav2 goal) -> O_IN -> OUTBOUND)
#       -> 입구 E(Nav2 goal) -> 충전 칸이나 다시 Q2. 급행으로 오지 않는 로봇은 O_IN에서 출고로 들어간다.
# 서는 지점(대기, 주차, 갈림)은 급행 띠와 OUT_DOCK에서 0.135(몸 반경 0.085 + 놓기 여유 0.05) 이상
# 떨어뜨렸다: 선 로봇이 그 구역을 쥐지 않는다. 지점끼리는 node_clear_m 0.20 이상이다(칸과 그 입구 짝은
# 0.14: 칸에 선 로봇은 자기 칸만 쥐고 입구는 놓는다, 2026-11-14). 급행 안의 대기 자리 O_X만 예외로
# 급행 띠 안에 서서 급행을 쥔다(OUT_DOCK에서는 0.135 떨어져 놓는다).
name: arena_v7
bounds: [0.0, 0.0, 1.98, 0.99]
shelves:
  - [0.68, 0.77, 1.56, 0.81]     # 북쪽 긴 진열대(급행 남쪽)
  - [0.68, 0.365, 0.99, 0.405]   # 남쪽 진열대, 서쪽
  - [1.25, 0.365, 1.56, 0.405]   # 남쪽 진열대, 동쪽
  # 충전 칸막이. 5 cm 지도에서 칸막이 1만 칸 경계 0.25를 걸쳐 두 칸(10 cm)으로 칠해진다. 걸친 칸을
  # 다 칠해야 실제보다 좁게 그리지 않는다: 화면과 전역 계획에서 넉넉하게 보일 뿐이고, 위치 추정은
  # 1 cm 지도를 쓰며 칸 출입은 고정 경로다
  - [0.24, 0.0, 0.26, 0.10]
  - [0.50, 0.0, 0.52, 0.10]
  - [0.76, 0.0, 0.78, 0.10]
# Nav2 계획만 막는 사각형(구역이 아니라 쥐지 않는다, 사용자 결정 2026-11-13): 남쪽 진열대 사이
# 건넘 틈. Gazebo 2판에서 로봇이 그 틈(폭 0.26)을 지나다 진열대 모서리 0.067까지 붙어 위치를 잃었다.
# 덧대지 않는다: 목적은 계획 차단이고, 덧대면 가운데 통로와 남쪽 마당이 좁아진다
# 칸막이 3 위 끝 둘레(y 0.20까지): Gazebo 1~3판에서 남쪽 마당을 서쪽으로 가던 로봇이 y ~0.16으로
# 와서 그 모서리를 긁고 멈췄다. 칸 고정 경로(P-3 <-> E-3)는 local costmap만 봐서 걸리지 않는다
keepout_extra: [[0.99, 0.365, 1.25, 0.405], [0.71, 0.0, 0.86, 0.20]]
zones:
  # 넓은 바닥 전부. 진열대 자리는 어느 구역도 아니다
  HALL:
    kind: shared
    capacity: 3
    rects: [[0.0, 0.0, 1.98, 0.395], [0.0, 0.395, 1.78, 0.63], [0.0, 0.63, 1.98, 0.765],
            [0.50, 0.765, 1.98, 0.77], [0.50, 0.77, 0.68, 0.81]]
  # 서쪽 경계는 W에서 0.10: 도킹을 마친 로봇이 HALL을 놓는다(0.085 + 오차 0.01). keepout(몸 반폭
  # 0.06 넓힘)은 x 1.72부터다. 마스크는 부풀지 않으므로 남쪽 진열대 동쪽 끝(1.56 + 내접 0.09 = 1.65)과
  # 1.72 사이에 전역 경로 중심이 지날 띠가 남는다(5 cm 지도에서 한 칸, test_layout_v7)
  WORK_DOCK: {kind: dock, rects: [[1.78, 0.395, 1.98, 0.63]]}
  J_E: {kind: dock, rects: [[1.56, 0.77, 1.98, 0.99]]}             # 급행 동쪽 입구, 한 대
  EXPRESS: {kind: lane, capacity: 2, rects: [[0.50, 0.81, 1.56, 0.99]]}
  OUT_DOCK: {kind: dock, rects: [[0.0, 0.765, 0.50, 0.99]]}
nodes:
  W: {x: 1.88, y: 0.495, kind: dock, yaw_deg: 90}      # WORK, 남쪽에서 들어가 북쪽을 본다
  O: {x: 0.285, y: 0.90, kind: dock, yaw_deg: 180}     # OUTBOUND, 급행 서쪽 끝, 서쪽을 본다
  # 급행 들머리(사용자 그림 2026-11-13): W에서 앞으로 곧게 나온 바로 위, J_E 안의 지나가는 점. W와 급행만
  # 잇는다. WORK_DOCK에서 0.17이라 선 로봇이 그것을 놓는다
  W_X: {x: 1.88, y: 0.80, kind: pass}
  # 출고의 들어오는 점과 나가는 점(사용자 그림 2026-11-13 밤: 파란 원이 들어오는 쪽, 빨간 원이 나가는
  # 쪽). 그림의 원은 OUT_DOCK 경계(0.765) 바로 아래지만 y 0.62에 둔다. 더 올리지 못하는 까닭 둘:
  #  - Nav2 goal로 닿는 자리라 선 로봇의 몸(0.06)이 도크 둘레의 keepout 띠(구역에서 0.06) 밖이어야
  #    한다: y 0.645가 끝이다.
  #  - 0.135(몸 반경 0.085 + 놓기 여유 0.05)보다 가까우면 거기 선 로봇이 OUT_DOCK을 쥔 채 있어 다음
  #    로봇이 출고에 들어가지 못한다: y 0.63이 끝이다. 0.01의 여유를 둔다.
  # 더 붙이려면 OUT_DOCK 구역을 줄이거나 이 두 구간을 고정 경로로 바꿔야 한다(사용자 결정).
  # O_IN은 급행으로 오지 않는 로봇이 출고로 들어가는 자리이고 출고가 바쁘면 여기서 기다린다. E-3과는
  # 잇지 않는다: 곧은 선이 남쪽 진열대 서쪽 끝 아래 모서리에서 0.082다(E-1, E-2, O_OUT으로 돈다).
  # O_OUT은 출고에서 나온 로봇이 Nav2 goal로 마당에 풀리는 자리다(서쪽 벽에서 0.15)
  O_IN: {x: 0.44, y: 0.62, kind: wait, yaw_deg: 100}
  # 급행 서쪽 끝의 출고 대기 자리(사용자 결정 2026-11-14, 안 A). W에서 짐을 싣고 나온 로봇은 출고가
  # 바빠도 급행으로 와서 여기서 기다렸다 출고가 비면 들어간다(그 전에는 O_IN으로 넓은 곳을 돌아
  # 23~25 s, 급행은 17 s였다). 급행 띠 안이라 선 로봇이 급행을 쥔다: 다음 로봇은 갈 자리가 없으니
  # 급행에 들어가지 않고 넓은 곳의 O_IN으로 간다. 어느 대기 자리로 갈지는 길 값으로 고른다(W에서는
  # O_X, 넓은 곳에서는 O_IN). x 0.655 = OUT_DOCK 동쪽 끝 0.50 + 0.135(몸 반경 0.085 + 놓기 여유
  # 0.05) + 위치 오차 여유 0.02: 선 로봇이 OUT_DOCK을 놓아 O_IN에서 온 로봇이 출고에 들어갈 수
  # 있다(처음 0.635는 여유가 없었다, Codex 검수). 북쪽 진열대 서쪽 끝 모서리(0.68, 0.81)에서
  # 0.093(몸 원 0.083), 넓은 곳에서 들어오는 고정 경로 out_in에서 0.252(고정 경로는 비켜 가지 못해
  # 몸 둘 + 0.01 = 0.176 이상), 나가는 out_out은 더 멀다.
  # 이 자리에서 나가는 길은 출고 O 하나뿐이다(지도 검사: 한 줄 구역 안의 대기 자리는 그 도크로만)
  O_X: {x: 0.655, y: 0.90, kind: wait, yaw_deg: 180}
  O_OUT: {x: 0.15, y: 0.62, kind: fork}
  # 가운데 통로 동쪽 끝의 우회 지점(2026-11-13 밤: 막힌 로봇이 돌아갈 길이 있어야 한다는 사용자
  # 지적). O_IN, Q2와 오가고 W에서 풀려 나온 로봇도 여기로 온다. M_E-Q2의 곧은 선은 남쪽 진열대 동쪽 끝(1.56)과 WORK_DOCK keepout
  # (1.72) 사이를 지난다(x 1.645: 진열대 끝에서 0.085, WORK_DOCK에서 0.135). y 0.55는 O_IN에서 오는
  # 곧은 선이 북쪽 진열대 서쪽 끝 모서리에서 0.086이 되는 자리다
  M_E: {x: 1.645, y: 0.55, kind: fork}
  # WORK 대기 줄(사용자 결정 2026-11-13 밤): 자리 둘. 앞자리 Q1(W 바로 남쪽), 줄 입구 Q2(남동 구석).
  # 마당에서는 Q2로만 들어오고 흐름은 Q2 -> Q1 -> W, 한 방향 고정 경로다. 줄 서기(line)라 줄에 선
  # 로봇이 줄 밖 로봇보다 앞 차례다. Gazebo에서는 고정 경로 컨트롤러가 충돌 검사를 하지 않고 Nav2
  # goal만 한다(실물은 확인 안 함). local costmap 발자국에 기본 덧댐 0.01이 붙으면 뒤 모서리 반경이
  # 0.098이라, Nav2 goal로 닿는 자리(Q2)는 벽에서 0.13 이상(0.098 + 칸 0.025 + 여유). 두 자리 사이는
  # 노드 놓는 거리(0.20)보다 멀다(0.215): 한 칸 당긴 로봇이 도착하면 뒷자리를 놓는다. Q2는 동쪽을 보고
  # 선다. Q2의 (1.66, 0.16)은 E-3에서 오는 곧은 선이 칸막이 3 둘레의 keepout(y 0.20까지) 위로 지나는
  # 자리다. 칸 입구 높이(0.27)로 올렸다가 사용자 지시로 다시 내렸다(2026-11-13 밤). E-1, E-2와는 잇지
  # 않는다: 주차를 0.10으로 옮긴 뒤(2026-11-14) 그 곧은 선이 P-3에 주차한 로봇 앞 0.113, 0.124를 지나
  # 몸끼리 닿을 만큼 가깝다. E-3을 거치는 길은 길이가 같고(1.543) 주차한 로봇에서 0.14를 지나며,
  # 이어진 Nav2 goal은 한 goal로 합쳐 보낸다
  Q1: {x: 1.85, y: 0.26, kind: wait, yaw_deg: 90}
  Q2: {x: 1.66, y: 0.16, kind: wait, yaw_deg: 0}
  # 충전 칸. y 0.10(사용자 2026-11-14 "제안대로". 0.11, 0.09, 0.08 순으로 바꿨다). 0.08에 두었을 때
  # Gazebo의 로봇은 0.118~0.148에 섰다: 후진 충돌 검사가 2.5 cm 칸을 써서 뒤 끝이 벽에서 약 2.5 cm
  # 안으로 가지 못하고, 후진 도착 허용치가 0.05였다. 0.10이 충돌 검사를 켠 채 닿는 가장 깊은 자리이고
  # 허용치는 0.02로 줄였다(nav2_params retreat_goal_checker). 북쪽을 보고 선 로봇의 뒤 끝은 벽에서
  # 0.0255다.
  # 칸 안에서는 돌지 않는다: 입구 E에서 북쪽을 보고 곧게
  # 후진해 들어가고 앞으로 곧게 나온다(Gazebo 1, 2판: Nav2 goal로 칸에서 나가다 셋째 칸막이 위 끝을
  # 잘라 RPP가 멈췄고, 칸막이 inflation 안에서 전역 계획이 실패했다)
  P-1: {x: 0.12, y: 0.10, kind: parking, yaw_deg: 90}
  P-2: {x: 0.38, y: 0.10, kind: parking, yaw_deg: 90}
  P-3: {x: 0.64, y: 0.10, kind: parking, yaw_deg: 90}
  # 칸 입구: 칸막이 끝(0.10) + 몸 원 0.083 + 여유보다 북쪽이고, 주차한 로봇에서 0.14다(사용자
  # 2026-11-14 "주차 줄이 너무 길다, 점 사이를 줄여": 0.27 -> 0.24, 주차 0.08 -> 0.10). 입구 줄을
  # 지나가는 로봇의 몸과 주차한 로봇의 앞 끝 사이는 0.044다. 0.226보다 내리면 입구 줄이 주차한
  # 로봇에 몸 둘 + 여유(0.126)보다 가까워진다
  # through: 이어진 Nav2 goal을 이 지점을 거쳐 Q2 같은 끝까지 한 goal로 합친다(사용자 2026-11-14
  # "합쳐": 로봇이 칸 입구에 들렀다 가지 않는다). 합친 goal은 Nav2에 끝만 알리므로 돌아가는 길을
  # 지키지 못한다: 우회 지점 M_E와 대기 지점 O_IN, Q2는 through가 아니고, 두 끝 사이의 가장 짧은
  # 길일 때만 합친다
  E-1: {x: 0.12, y: 0.24, kind: fork, yaw_deg: 90, through: true}
  E-2: {x: 0.38, y: 0.24, kind: fork, yaw_deg: 90, through: true}
  E-3: {x: 0.64, y: 0.24, kind: fork, yaw_deg: 90, through: true}
paths:  # 고정 경로(FollowPath 선). [x, y]는 꺾는 점
  # 줄 입구에서 앞자리로: 구석(벽에서 0.13)까지 동쪽으로 가서 돌고 북쪽으로 곧게. 앞자리에 닿는
  # 방향이 서는 방향(북쪽)과 같아 앞자리에서 돌지 않는다
  q_step: {points: [Q2, [1.85, 0.16], Q1]}
  work_in: {points: [Q1, W]}                           # 앞자리에서 W로(북쪽, 동쪽으로 0.03)
  work_out: {points: [W, W_X]}                         # 급행으로 나가기: 앞으로 북쪽으로
  # 급행: 출고로 갈 때만, 서쪽으로 한 방향. 꺾는 점은 진열대 모서리에서 0.166. 서쪽 끝 대기 자리
  # O_X에서 끊긴다(W_X -> O_X, O_X -> O): 출고가 바쁘면 O_X에서 기다린다. 출고로 바로 가는 트립은
  # O_X에서 서지 않는다(order 모델은 도착 전에 다음 구간을 잡고, 끈 모델은 OUT_DOCK까지 한 번에 잡는다)
  express: {points: [W_X, [1.84, 0.86], [1.70, 0.90], O_X, O]}
  # 넓은 곳에서 출고로(급행으로 오지 않는 로봇). 꺾는 점은 OUT_DOCK 안이라 급행 띠를 쥐지 않는다
  out_in: {points: [O_IN, [0.40, 0.90], O]}
  # 출고에서 나오기(사용자 그림, 빨간 화살표): 후진하지 않고 앞으로(서쪽) 가서 남쪽으로 꺾어 도크 입구
  # 아래의 O_OUT으로. 꺾는 점은 서쪽 벽에서 0.16
  out_out: {points: [O, [0.16, 0.86], O_OUT]}
  bay_in_1: {points: [E-1, P-1], reverse: true}        # 충전 칸: 후진으로 들어가 북쪽을 보고 선다
  bay_in_2: {points: [E-2, P-2], reverse: true}
  bay_in_3: {points: [E-3, P-3], reverse: true}
  bay_out_1: {points: [P-1, E-1]}                      # 앞으로 곧게 나온다
  bay_out_2: {points: [P-2, E-2]}
  bay_out_3: {points: [P-3, E-3]}
nav:  # Nav2 goal 이음(HALL 안). 곧은 선이 keepout이나 진열대를 지나거나, 오래 서는 자리(도크, 대기,
  # 갈림)의 로봇 몸 원(0.083)에 지나가는 로봇 반 폭(0.056)보다 가깝거나, 칸막이 끝에 몸 원 + 0.02보다
  # 가까운 쌍은 잇지 않는다(test_layout_v7). 칸 입구 셋이 마당의 갈림이다: 서로, 그리고 출고의 두 점과
  # 곧게 잇고, 줄 입구 Q2와는 E-3만 잇는다(Q2 설명). 칸에 선 로봇은 자기 입구를 놓으므로(0.14) 다른
  # 로봇이 그 입구를 지난다. 입구로 후진해 들어가는 동안에는 그 입구를 쥐어 다른 입구로 다닌다
  - {nodes: [E-1, E-2, E-3]}
  - {nodes: [E-3, Q2]}
  - {nodes: [O_OUT, E-1]}
  - {nodes: [O_OUT, E-2]}
  - {nodes: [O_OUT, E-3]}
  - {nodes: [O_IN, E-1]}
  - {nodes: [O_IN, E-2]}
  - {nodes: [O_OUT, O_IN]}                             # 우회로로 가는 이음
  - {nodes: [O_IN, M_E]}                               # 우회로: 가운데 통로
  - {nodes: [M_E, Q2]}
  # WORK에서 넓은 곳으로 풀려 나가기(사용자 결정 2026-11-14 "W에서 HALL로 나가는 건 경로가 아니라
  # goal 방식으로 풀면 된다"). 한 방향이고 들어오는 길은 그대로 Q1에서 고정 경로다. W는 WORK_DOCK
  # keepout 안이라 마스크가 W에서 넓은 곳까지 곧은 선 둘레(몸 반폭)를 연다(막다른 주머니,
  # keepout_openings). 넓은 곳 쪽(W -> M_E -> O_IN -> 출고)이 급행보다 0.09 m 짧으므로, W에서 M_E
  # 쪽으로 약 100도 제자리 돌기 값 0.3 m(0.12 m/s로 2.5 s)를 길 고르기에만 더한다: 급행이 비면
  # 급행, 급행이 막혔다고 표시되거나 들머리 J_E를 다른 로봇이 쥐고 있으면(6 s) 넓은 곳으로 간다
  - {nodes: [W, M_E], leave_dock: true, extra_m: 0.3}
stations:
  WORK: {dock: W, queue: [Q1, Q2], line: true, server: workcell, arms: [arm1, arm2], action: fill}
  # 대기 자리 둘 중 길 값이 싼 쪽으로 간다(W에서는 급행 끝 O_X, 넓은 곳에서는 O_IN)
  OUTBOUND: {dock: O, queue: [O_IN, O_X], server: arm3, arms: [arm3], action: swap}
parking: [P-1, P-2, P-3]
