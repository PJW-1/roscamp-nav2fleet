# 배치 v7: 사용자가 확정한 경기장(2026-11-13, 스케치 그림 v8 뒤 진열대를 x 0.68~1.56으로 내림).
# 실물로 놓아 본 적 없는 가정이다. 벽 안쪽 1.98 x 0.99 m. 치수 출처: 자유바닥 저장소 sites/arena_v7.yaml.
# 진열대 셋(두께 0.04): 북쪽 긴 것 y 0.77~0.81, 남쪽 둘 y 0.365~0.405(사이 건넘 틈 0.26).
# 충전 칸막이 셋은 남쪽 벽에 붙고 shelves에 넣는다(월드, 지도, 여유 검사가 함께 본다).
# 칸 빈 폭 0.24는 잠정값이다(그림은 0.20).
#
#   y
#  0.99 +---------------+---------------------------------+----------+
#       |   O  OUT_DOCK |            EXPRESS  <-----------|      J_E |  급행 가운데 y 0.90
#  0.81 |               |  +==============================+          |  진열대 y 0.77~0.81
#  0.765+------+        |  |                              |     W_X  |  y 0.70, WORK 출구 갈림
#       |  N_O                     가운데 통로                  N_E     |  y 0.58
#       | O_Q                                                     [W]|  WORK y 0.495, 북쪽 보기
#  0.405|                  +=========+   틈   +===========+          |  진열대 y 0.365~0.405
#       | E-1   E-2   E-3          남쪽 통로                 G     F |  y 0.25~0.30
#       | P-1 | P-2 | P-3 |                       Q2      Q1        |  y 0.10~0.11, WORK 대기 줄
#  0    +-----+-----+-----+--------------------------------------------+
#       0    0.25  0.51  0.77                                 1.56  1.78  1.98  x
#
# 구역(사용자 결정 2026-11-13): 잠그는 것은 급행 띠(EXPRESS, 입구 J_E)와 도크 자리(WORK_DOCK,
# OUT_DOCK)뿐이다. HALL은 나머지 바닥 전부다(진열대와 칸막이 자리도 덮는다. 그 자리에는 지점과
# 길이 없다). 로봇끼리는 Nav2가 피한다: v7은 관제가 주는 다른 로봇 위치(peer_obstacles)를 켜야
# 한다(실물 nav2.launch.py의 기본값은 false). 통로마다 정원 1 구역을 두었던 첫 판은 한 이동에
# 구역 다섯을 잡았고, 격리된 로봇이 남쪽 통로를 쥔 채 길이 잠겼다(Gazebo 1판).
# 흐름: 충전 칸 -> 입구 E -> 가운데 통로(Nav2 goal) -> G -> WORK 진입점 F(차례가 아니면 줄 꼬리 Q2 ->
#       Q1 -> F) -> WORK(고정 경로) -> 북쪽으로 나가 갈림 W_X -> 급행(고정 경로) -> OUTBOUND, 또는
#       W_X -> 넓은 곳(N_E) -> 마당. OUTBOUND -> 앞으로 서쪽, 남쪽으로 꺾어 N_O -> 입구 E -> 충전 칸.
# 서는 지점(대기, 주차, 갈림)은 급행 띠와 OUT_DOCK에서 0.135(몸 반경 0.085 + 놓기 여유 0.05) 이상
# 떨어뜨렸다: 선 로봇이 그 구역을 쥐지 않는다. 지점끼리는 node_clear_m 0.20 이상이다(칸과 그 입구 짝은
# 0.14: 칸에 선 로봇이 자기 입구를 쥐어도 그 칸 말고는 쓰지 않는다).
name: arena_v7
bounds: [0.0, 0.0, 1.98, 0.99]
shelves:
  - [0.68, 0.77, 1.56, 0.81]     # 북쪽 긴 진열대(급행 남쪽)
  - [0.68, 0.365, 0.99, 0.405]   # 남쪽 진열대, 서쪽
  - [1.25, 0.365, 1.56, 0.405]   # 남쪽 진열대, 동쪽
  # 충전 칸막이. 5 cm 지도에서 칸막이 1만 칸 경계 0.25를 걸쳐 두 칸(10 cm)으로 칠해진다. 걸친 칸을
  # 다 칠해야 실제보다 좁게 그리지 않는다: 화면과 전역 계획에서 넉넉하게 보일 뿐이고, 위치 추정은
  # 1 cm 지도를 쓰며 칸 출입은 고정 경로다
  - [0.24, 0.0, 0.26, 0.10]
  - [0.50, 0.0, 0.52, 0.10]
  - [0.76, 0.0, 0.78, 0.10]
# Nav2 계획만 막는 사각형(구역이 아니라 쥐지 않는다, 사용자 결정 2026-11-13): 남쪽 진열대 사이
# 건넘 틈. Gazebo 2판에서 로봇이 그 틈(폭 0.26)을 지나다 진열대 모서리 0.067까지 붙어 위치를 잃었다.
# 덧대지 않는다: 목적은 계획 차단이고, 덧대면 가운데 통로와 남쪽 마당이 좁아진다
# 칸막이 3 위 끝 둘레(y 0.20까지): Gazebo 1~3판에서 남쪽 마당을 서쪽으로 가던 로봇이 y ~0.16으로
# 와서 그 모서리를 긁고 멈췄다. 칸 고정 경로(P-3 <-> E-3)는 local costmap만 봐서 걸리지 않는다
keepout_extra: [[0.99, 0.365, 1.25, 0.405], [0.71, 0.0, 0.86, 0.20]]
zones:
  # 넓은 바닥 전부. 진열대 자리는 어느 구역도 아니다
  HALL:
    kind: shared
    capacity: 3
    rects: [[0.0, 0.0, 1.98, 0.395], [0.0, 0.395, 1.78, 0.63], [0.0, 0.63, 1.98, 0.765],
            [0.50, 0.765, 1.98, 0.77], [0.50, 0.77, 0.68, 0.81]]
  # 서쪽 경계는 W에서 0.10: 도킹을 마친 로봇이 HALL을 놓는다(0.085 + 오차 0.01). keepout(몸 반폭
  # 0.06 넓힘)은 x 1.72부터다. 마스크는 부풀지 않으므로 남쪽 진열대 동쪽 끝(1.56 + 내접 0.09 = 1.65)과
  # 1.72 사이에 전역 경로 중심이 지날 띠가 남는다(5 cm 지도에서 한 칸, test_layout_v7)
  WORK_DOCK: {kind: dock, rects: [[1.78, 0.395, 1.98, 0.63]]}
  J_E: {kind: dock, rects: [[1.56, 0.77, 1.98, 0.99]]}             # 급행 동쪽 입구, 한 대
  EXPRESS: {kind: lane, capacity: 2, rects: [[0.50, 0.81, 1.56, 0.99]]}
  OUT_DOCK: {kind: dock, rects: [[0.0, 0.765, 0.50, 0.99]]}
nodes:
  W: {x: 1.88, y: 0.495, kind: dock, yaw_deg: 90}      # WORK, 남쪽에서 들어가 북쪽을 본다
  O: {x: 0.285, y: 0.90, kind: dock, yaw_deg: 180}     # OUTBOUND, 급행 서쪽 끝, 서쪽을 본다
  # WORK 출구 갈림(사용자 2026-11-13): W에서 앞으로 곧게 나온 바로 위 HALL. 여기서 급행을 타거나
  # 넓은 곳(서쪽 N_E)으로 간다. WORK_DOCK과 J_E에서 0.07: 여기 선 로봇은 WORK_DOCK을 쥔 채다
  W_X: {x: 1.88, y: 0.70, kind: fork}
  N_E: {x: 1.64, y: 0.58, kind: fork}                  # 가운데 통로 동쪽 입구
  N_O: {x: 0.42, y: 0.62, kind: fork}                  # 가운데 통로 서쪽 입구, 출고 진입 시작점
  # WORK 진입점: 동쪽 벽 선 위(W에서 0.24). 대기 자리가 아니라 지나가는 점이다
  F: {x: 1.88, y: 0.255, kind: fork, yaw_deg: 90}
  # WORK 대기 줄(사용자 결정 2026-11-13: 두 자리, 줄 서기): 남쪽 벽 선 위, Q1이 앞, Q2가 꼬리.
  # 꼬리 Q2로만 들어오고(G에서) 앞으로만 흐른다: Q2 -> Q1 -> F(고정 경로) -> W. 줄은 W로 가는 길
  # (G -> F -> W) 밖이다: 대기 자리가 유일한 길 위에 있으면 도크 차례 규칙이 세 대 사이에서 돌았다
  # (첫 v7, 머리 없는 판 0/8, 0/10). 동쪽 진열대 조각 아래(대기 로봇 위 0.18)로는 지나가는 이음이 없다
  Q1: {x: 1.62, y: 0.10, kind: wait, yaw_deg: 0}
  Q2: {x: 1.40, y: 0.10, kind: wait, yaw_deg: 0}
  # 가운데 통로에서 F로 내려가는 갈림(빨간 선): N_E에서 F로 곧게 가는 선은 WORK_DOCK keepout을 지난다
  G: {x: 1.66, y: 0.33, kind: fork}
  O_Q: {x: 0.15, y: 0.55, kind: wait, yaw_deg: 90}     # 출고 대기 자리
  # 충전 칸. y는 자료의 0.09보다 0.02 북쪽. 칸 안에서는 돌지 않는다: 입구 E에서 북쪽을 보고 곧게
  # 후진해 들어가고 앞으로 곧게 나온다(Gazebo 1, 2판: Nav2 goal로 칸에서 나가다 셋째 칸막이 위 끝을
  # 잘라 RPP가 멈췄고, 칸막이 inflation 안에서 전역 계획이 실패했다)
  P-1: {x: 0.12, y: 0.11, kind: parking, yaw_deg: 90}
  P-2: {x: 0.38, y: 0.11, kind: parking, yaw_deg: 90}
  P-3: {x: 0.64, y: 0.11, kind: parking, yaw_deg: 90}
  # 칸 입구: 칸막이 끝(0.10) + 몸 원 0.083 + 여유보다 북쪽. E-3은 남쪽 진열대 서쪽 끝 모서리에서 0.122
  E-1: {x: 0.12, y: 0.25, kind: fork, yaw_deg: 90}
  E-2: {x: 0.38, y: 0.25, kind: fork, yaw_deg: 90}
  E-3: {x: 0.64, y: 0.25, kind: fork, yaw_deg: 90}
paths:  # 고정 경로(FollowPath 선). [x, y]는 꺾는 점
  work_in: {points: [F, W]}                            # 진입점에서 북쪽으로 곧게 0.24
  work_out: {points: [W, W_X]}                         # 앞으로 북쪽으로 나간다
  # 급행: 출고로 갈 때만, 서쪽으로 한 방향. 꺾는 점은 진열대 모서리에서 0.166
  express: {points: [W_X, [1.84, 0.86], [1.70, 0.90], O]}
  # 급행을 타지 않으면(또는 급행이 막히면) 넓은 곳으로. WORK_DOCK·J_E keepout 사이 띠(0.69~0.705)가
  # 좁아 Nav2 goal이 아니라 고정 경로로 N_E까지 간다
  work_west: {points: [W_X, [1.70, 0.70], N_E]}
  # 넓은 곳에서 출고로(급행이 막혔을 때). 꺾는 점은 OUT_DOCK 안
  out_in: {points: [N_O, [0.40, 0.90], O]}
  # 출고에서 나오기(사용자 2026-11-13, 파란 선): 후진하지 않고 앞으로(서쪽) 가서 남쪽으로 꺾어 넓은
  # 곳의 N_O로. 서쪽 벽에서 0.077, 출고 대기 O_Q에 선 로봇 몸에서 0.152(기준 0.139)
  out_out: {points: [O, [0.16, 0.86], [0.18, 0.70], N_O]}
  q_front: {points: [Q1, F]}                          # 줄 앞에서 진입점으로, 한 방향
  bay_in_1: {points: [E-1, P-1], reverse: true}        # 충전 칸: 후진으로 들어가 북쪽을 보고 선다
  bay_in_2: {points: [E-2, P-2], reverse: true}
  bay_in_3: {points: [E-3, P-3], reverse: true}
  bay_out_1: {points: [P-1, E-1]}                      # 앞으로 곧게 나온다
  bay_out_2: {points: [P-2, E-2]}
  bay_out_3: {points: [P-3, E-3]}
nav:  # Nav2 goal 이음(HALL 안). 곧은 선이 keepout이나 진열대를 지나거나, 오래 서는 자리(도크, 대기,
  # 갈림)의 로봇 몸 원(0.083)에 지나가는 로봇 반 폭(0.056)보다 가깝거나, 칸막이 끝에 몸 원 + 0.02보다
  # 가까운 쌍은 잇지 않는다(test_layout_v7). 남쪽 마당의 동쪽(진열대 아래)은 줄 자리라 가로지르지
  # 않는다: 서쪽 마당(칸)과 동쪽(G, F, 줄)은 가운데 통로(N_O - N_E)로 오간다
  - {nodes: [O_Q, E-1, E-2]}
  - {nodes: [O_Q, E-3]}
  - {nodes: [E-2, E-3]}
  - {nodes: [N_O, N_E]}
  - {nodes: [N_O, O_Q]}
  - {nodes: [N_O, E-1]}
  - {nodes: [N_O, E-2]}
  - {nodes: [N_O, E-3]}
  - {nodes: [N_E, G]}
  - {nodes: [G, F]}
  - {nodes: [G, Q2]}                                   # 줄 꼬리로 들어오기
  - {nodes: [Q2, Q1]}                                  # 한 칸 당기기(줄을 떠나는 로봇은 거꾸로)
stations:
  WORK: {dock: W, queue: [Q1, Q2], line: true, server: workcell, arms: [arm1, arm2], action: fill}
  OUTBOUND: {dock: O, queue: [O_Q], server: arm3, arms: [arm3], action: swap}
parking: [P-1, P-2, P-3]
