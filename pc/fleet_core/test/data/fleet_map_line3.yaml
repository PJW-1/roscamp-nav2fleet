# 배치 v7 경기장: 벽 안쪽 1.98 x 0.99 m, 진열대 셋, 충전 칸막이 셋(shelves에 포함).
#
#   y
#  0.99 +---------------+---------------------------------+----------+
#       |   O  OUT_DOCK |            EXPRESS  <-----------|      J_E |  급행 가운데 y 0.90
#  0.81 |               |  +==============================+          |  진열대 y 0.77~0.81
#  0.765+------+        |  |                              |     W_X  |  y 0.80, 급행 들머리
#       |  N_O                     가운데 통로                  N_E     |  y 0.58
#       | O_Q                                                     [W]|  WORK y 0.495, 북쪽 보기
#  0.405|                  +=========+   틈   +===========+          |  진열대 y 0.365~0.405
#       | E-1   E-2   E-3          남쪽 통로                 G    Q1 |  y 0.25~0.33, 줄 앞자리
#       | P-1 | P-2 | P-3 |                         Q3 --> Q2  -^    |  y 0.11~0.13, 줄 둘째와 꼬리
#  0    +-----+-----+-----+--------------------------------------------+
#       0    0.25  0.51  0.77                                 1.56  1.78  1.98  x
# 구역: 잠그는 곳은 급행 띠(EXPRESS)와 도크 자리(WORK_DOCK, OUT_DOCK)뿐이고 HALL이 나머지 바닥이다.
# 흐름: 충전 칸 -> E -> 가운데 통로 -> G -> Q1(줄이 차면 Q3 -> Q2 -> Q1) -> WORK -> W_X -> 급행 -> OUTBOUND,
#       또는 W에서 N_E로 바로 -> 마당. OUTBOUND -> 서쪽 -> N_O -> E -> 충전 칸.
# 서는 지점은 급행 띠와 OUT_DOCK에서 0.135 이상, 지점끼리는 node_clear_m 0.20 이상 떨어뜨렸다(칸과 입구 짝은 0.14).
name: arena_v7
bounds: [0.0, 0.0, 1.98, 0.99]
shelves:
  - [0.68, 0.77, 1.56, 0.81]     # 북쪽 긴 진열대(급행 남쪽)
  - [0.68, 0.365, 0.99, 0.405]   # 남쪽 진열대, 서쪽
  - [1.25, 0.365, 1.56, 0.405]   # 남쪽 진열대, 동쪽
  # 충전 칸막이: 5 cm 지도에서 걸친 칸을 다 칠한다
  - [0.24, 0.0, 0.26, 0.10]
  - [0.50, 0.0, 0.52, 0.10]
  - [0.76, 0.0, 0.78, 0.10]
# Nav2 계획만 막는 사각형(구역 아님): 남쪽 진열대 사이 건넘 틈과 칸막이 3 위 끝 둘레
keepout_extra: [[0.99, 0.365, 1.25, 0.405], [0.71, 0.0, 0.86, 0.20]]
zones:
  # 넓은 바닥 전부(진열대 자리는 구역이 아니다)
  HALL:
    kind: shared
    capacity: 3
    rects: [[0.0, 0.0, 1.98, 0.395], [0.0, 0.395, 1.78, 0.63], [0.0, 0.63, 1.98, 0.765],
            [0.50, 0.765, 1.98, 0.77], [0.50, 0.77, 0.68, 0.81]]
  # 서쪽 경계를 W에서 0.10 띄워 도킹을 마친 로봇이 HALL을 놓게 한다
  WORK_DOCK: {kind: dock, rects: [[1.78, 0.395, 1.98, 0.63]]}
  J_E: {kind: dock, rects: [[1.56, 0.77, 1.98, 0.99]]}             # 급행 동쪽 입구, 한 대
  EXPRESS: {kind: lane, capacity: 2, rects: [[0.50, 0.81, 1.56, 0.99]]}
  OUT_DOCK: {kind: dock, rects: [[0.0, 0.765, 0.50, 0.99]]}
nodes:
  W: {x: 1.88, y: 0.495, kind: dock, yaw_deg: 90}      # WORK, 남쪽에서 들어가 북쪽을 본다
  O: {x: 0.285, y: 0.90, kind: dock, yaw_deg: 180}     # OUTBOUND, 급행 서쪽 끝, 서쪽을 본다
  # 급행 들머리: W 바로 북쪽의 지나가는 점, W와 급행만 잇는다
  W_X: {x: 1.88, y: 0.80, kind: pass}
  N_E: {x: 1.64, y: 0.58, kind: fork}                  # 가운데 통로 동쪽 입구
  N_O: {x: 0.42, y: 0.62, kind: fork}                  # 가운데 통로 서쪽 입구, 출고 진입 시작점
  # WORK 대기 줄: 앞자리 Q1, 둘째 Q2, 꼬리 Q3. 흐름은 Q3 -> Q2 -> Q1 -> W 한 방향 고정 경로다.
  # Nav2 goal로 닿는 Q1, Q3은 벽에서 0.13 이상 띄운다. 이웃 자리 사이는 노드 놓는 거리(0.20)보다 멀다.
  Q1: {x: 1.85, y: 0.26, kind: wait, yaw_deg: 90}
  Q2: {x: 1.69, y: 0.13, kind: wait, yaw_deg: 0}
  Q3: {x: 1.48, y: 0.13, kind: wait, yaw_deg: 0}
  # 가운데 통로에서 줄로 내려가는 갈림
  G: {x: 1.66, y: 0.33, kind: fork}
  # 출고 대기 자리: 출고 출구 고정 경로에서 0.193 떨어뜨렸다
  O_Q: {x: 0.14, y: 0.51, kind: wait, yaw_deg: 90}
  # 충전 칸: 칸 안에서 돌지 않고 입구에서 후진해 들어가 앞으로 나온다
  P-1: {x: 0.12, y: 0.11, kind: parking, yaw_deg: 90}
  P-2: {x: 0.38, y: 0.11, kind: parking, yaw_deg: 90}
  P-3: {x: 0.64, y: 0.11, kind: parking, yaw_deg: 90}
  # 칸 입구: 칸막이 끝 + 몸 원보다 북쪽
  E-1: {x: 0.12, y: 0.25, kind: fork, yaw_deg: 90}
  E-2: {x: 0.38, y: 0.25, kind: fork, yaw_deg: 90}
  E-3: {x: 0.64, y: 0.25, kind: fork, yaw_deg: 90}
paths:  # 고정 경로(FollowPath 선). [x, y]는 꺾는 점
  q_in: {points: [Q3, Q2]}                             # 줄: 꼬리에서 둘째로, 한 방향
  # 둘째에서 앞자리로: 구석까지 동쪽으로 가서 북쪽으로 곧게
  q_step: {points: [Q2, [1.85, 0.13], Q1]}
  work_in: {points: [Q1, W]}                           # 앞자리에서 북쪽으로
  work_out: {points: [W, W_X]}                         # 급행을 탈 때: 앞으로 북쪽으로 나간다
  # 급행: 출고로 갈 때만 서쪽으로 한 방향
  express: {points: [W_X, [1.84, 0.86], [1.70, 0.90], O]}
  # 급행을 안 탈 때: W에서 북쪽으로 나가 서쪽으로 꺾어 N_E로(급행보다 3 cm 길다)
  work_hall: {points: [W, [1.86, 0.60], [1.78, 0.64], N_E]}
  # 넓은 곳에서 출고로(급행이 막혔을 때)
  out_in: {points: [N_O, [0.40, 0.90], O]}
  # 출고에서 나오기: 앞으로(서쪽) 가서 남쪽으로 꺾어 N_O로
  out_out: {points: [O, [0.16, 0.86], [0.18, 0.70], N_O]}
  bay_in_1: {points: [E-1, P-1], reverse: true}        # 충전 칸: 후진으로 들어가 북쪽을 보고 선다
  bay_in_2: {points: [E-2, P-2], reverse: true}
  bay_in_3: {points: [E-3, P-3], reverse: true}
  bay_out_1: {points: [P-1, E-1]}                      # 앞으로 곧게 나온다
  bay_out_2: {points: [P-2, E-2]}
  bay_out_3: {points: [P-3, E-3]}
nav:  # Nav2 goal 이음(HALL 안)
  # 곧은 선이 keepout, 진열대, 칸막이 끝, 선 로봇 몸 원에 걸리는 쌍은 잇지 않는다(test_layout_v7)
  - {nodes: [O_Q, E-1, E-2]}
  - {nodes: [O_Q, E-3]}
  - {nodes: [E-2, E-3]}
  - {nodes: [N_O, N_E]}
  - {nodes: [N_O, O_Q]}
  - {nodes: [N_O, E-1]}
  - {nodes: [N_O, E-2]}
  - {nodes: [N_O, E-3]}
  - {nodes: [N_E, G]}
  - {nodes: [G, Q1]}                                   # 빈 줄이면 앞자리로 바로, 줄을 떠날 때
  - {nodes: [G, Q3]}                                   # 줄 꼬리로
stations:
  WORK: {dock: W, queue: [Q1, Q2, Q3], line: true, server: workcell, arms: [arm_left, arm_right], action: fill}
  OUTBOUND: {dock: O, queue: [O_Q], server: arm_ship, arms: [arm_ship], action: swap}
parking: [P-1, P-2, P-3]
