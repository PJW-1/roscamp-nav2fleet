# FMS 재시작 시나리오: 이동 중 FMS가 죽고 pode3가 조용한 동안 다시 올라온다(죽이는 쪽은 test_fms_restart.py).
# 로봇을 느리게 둬서 타임아웃 시점에 세 대 모두 이동 중이다.
# 새 FMS는 진행 중인 바구니를 몰라 두 번 채울 수 있으므로 재고를 넉넉히 두고 출하 수는 고정하지 않는다.
seed: 7
speed_factor: 5.0
timeout_s: 1500
stock: {arm_left: {A: 40, B: 40}, arm_right: {C: 40, D: 40}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 0, id: O-003, items: {A: 1, D: 1}}
robots:
  pode1: {start: P-1, speed_scale: 0.1667, pose_noise_m: 0.03}
  pode2: {start: P-2, speed_scale: 0.1667, pose_noise_m: 0.03}
  pode3: {start: P-3, speed_scale: 0.1667, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults:
  - {at_s: 50, robot: pode3, type: comm_loss, duration_s: 70}
expect:
  all_orders_finished: true
  orders_shipped_min: 1
  events_include: [ROBOT_NOT_REPORTING]
