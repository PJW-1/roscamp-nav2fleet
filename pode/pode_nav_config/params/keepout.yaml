# 급행 레인과 도크 구역을 Nav2 goal 경로에서 막는 keepout 필터.
# launch 인자 keepout_mask가 있을 때만 nav2_params.yaml 위에 덧붙는다.
# global costmap에만 걸어 NavFn만 피하고, FollowPath 셋은 그대로 간다.
# 마스크의 막힌 칸이 keepout이고 inflation 뒤에 얹히므로, 마스크를 몸 반폭(0.06 m)만큼 넓혀 만든다.

global_costmap:
  global_costmap:
    ros__parameters:
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: <robot_namespace>/costmap_filter_info

costmap_filter_info_server:
  ros__parameters:
    type: 0  # keepout
    filter_info_topic: costmap_filter_info
    mask_topic: <robot_namespace>/keepout_filter_mask
    base: 0.0
    multiplier: 1.0

keepout_mask_server:
  ros__parameters:
    topic_name: keepout_filter_mask
    frame_id: map
    yaml_filename: ""  # launch 인자 keepout_mask
