# Pode 한 대의 Nav2 설정. nav2.launch.py가 로봇 namespace(/pode1 등) 안에 띄운다.
# <robot_namespace>는 launch가 "/pode1"처럼 바꾼다(Jazzy costmap 층은 상대 토픽을 노드 안으로 풀어 절대 이름이 필요하다).

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.05  # 1 cm 지도에 맞춘 값
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map_fine  # AMCL만 1 cm 지도를 읽는다(costmap은 5 cm 지도 map)
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}  # launch 인자로 덮는다

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map
    yaml_filename: ""  # launch 인자 map

map_server_fine:
  ros__parameters:
    topic_name: map_fine
    frame_id: map
    yaml_filename: ""  # launch 인자 map_fine

# 계약의 navigate_to_pose. MoveTo mode nav_goal일 때만 쓰고, follow_path는 controller를 바로 부른다.
# 복구(Spin, Wait, BackUp, 지도 지우기)는 nav_goal에서만 허용한다.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # navigate_through_poses는 띄우지 않는다
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    odom_topic: odom
    # 관제가 보내는 로봇별 속도 제한 토픽(버전 2에서 씀). 지우지 않는다
    speed_limit_topic: speed_limit
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "retreat_goal_checker",
                           "free_heading_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathThrough", "FollowPathReverse", "FollowPathGoal"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # 관제 도착 허용치(0.15 m)보다 작게
      yaw_goal_tolerance: 0.12
    # 모든 후진(FollowPathReverse, 물러나기)용: 끝 방향은 보지 않고 위치만 좁게 본다(reverse_goal_checker_id).
    retreat_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 3.2
    # 다음 조각이 Nav2 goal인 고정 경로용: 끝 방향을 맞추지 않아 불필요한 제자리 회전을 없앤다(free_heading_goal_checker_id).
    free_heading_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.2
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12  # 순항 속도 (m/s)
      # 앞보기는 속도에 비례한다(0.8초 앞, 0.10~0.25 m). 곡률 규칙이 반지름 0.10 m 호에서 속도를 낮춘다.
      lookahead_dist: 0.10  # 속도 비례를 켜서 쓰지 않는다
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.25
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      # 고정 경로가 짧아(0.14~0.40 m) 끝 0.10 m 앞부터만 줄인다. FollowPathReverse도 같은 값이다.
      approach_velocity_scaling_dist: 0.10
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6  # 충돌 검사 앞보기 시간 (s)
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.25
      regulated_linear_scaling_min_speed: 0.05
      # 꺾이는 곳을 반지름 0.10 m 호로 보내므로 호 위에서 서서 돌지 않게 0.70 rad로 둔다. 후진은 BackUp이 맡는다.
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      # RPP가 inscribed 반지름(0.06 m) 이상을 읽으므로, 경로 옆 상자가 속도를 최저로 묶지 않게 0.05로 둔다.
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2
    # 0.5 m 잠금 경계에서 끝나는 경로용(through_controller_id). FollowPath의 복사본이고 approach 거리만 0.05 m로 다르다.
    # 경로를 약 0.1 m마다 다시 보내므로 긴 감속 구간이 끝나지 않아, 경계에서는 pode_fsm의 속도 제한이 멈춘다.
    FollowPathThrough:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12
      lookahead_dist: 0.10
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.25
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.05  # FollowPath와 다른 유일한 값
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.25
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2

    # 경로를 따라 물러나는 후진(reverse_controller_id): 지나온 길을 거꾸로 보내면 RPP가 뒤로 따른다.
    # 충돌 검사가 후진 방향을 보므로 뒤의 장애물이 멈춘다. FollowPath와 다른 키는 desired_linear_vel,
    # use_rotate_to_heading, allow_reversing뿐이다(시험이 확인한다).
    FollowPathReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.05  # 물러나기는 천천히
      lookahead_dist: 0.10
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.25
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.10
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.25
      regulated_linear_scaling_min_speed: 0.05
      # 후진 controller라 제자리 회전을 끄고 후진을 켠다(둘은 함께 켤 수 없다)
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_min_angle: 0.70  # 쓰지 않는다
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2

    # FollowPathGoal(넓은 구역 Nav2 goal 컨트롤러)의 값은 avoidance.yaml의 follow_path_goal에 있다. 이름만 여기서 고정한다.

    # Nav2 goal용 MPPI(RPP와 비교용). 시뮬에서만 controller_plugins에 더해지고 실물 목록에는 없다.
    # bt의 ControllerSelector에 이 이름을 보내면 마당 Nav2 goal만 이것으로 간다. 속도와 가속 한계는 Gazebo와 Isaac에 맞췄다.
    FollowPathMPPI:
      # 제자리 회전은 RotationShim이 맡고 나머지는 MPPI가 한다(MPPI만으로는 큰 방향 오차에서 거의 돌지 못한다)
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.25  # 경로 방향과 이만큼(rad) 넘게 틀어지면 먼저 제자리에서 돈다
      forward_sampling_distance: 0.15  # 경로 방향을 재는 앞 점 거리 (m)
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0  # 돌 때 이만큼 앞까지 충돌 검사
      rotate_to_goal_heading: true  # goal에서 마지막 방향 맞추기도 제자리 회전으로
      time_steps: 83  # 4.15초 앞(0.12 m/s에서 약 0.5 m)
      model_dt: 0.05  # controller_frequency 20 Hz와 같게
      batch_size: 1000  # 실물 Pi4 CPU를 생각해 기본의 반
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # vx_std 0.2: 작으면 평균 명령이 속도를 늦게 따라간다
      vx_std: 0.2
      wz_std: 0.4
      vx_max: 0.12  # nav_speed.yaml
      vx_min: -0.05  # Isaac v_min(실물 후진 0.05 m/s)
      wz_max: 1.0  # Gazebo DiffDrive, Isaac w_max, FollowPathGoal rotate_to_heading_angular_vel
      ax_max: 2.0  # Gazebo DiffDrive max_acceleration, Isaac acc_v
      ax_min: -2.0
      az_max: 2.0  # Gazebo DiffDrive, Isaac acc_w
      prune_distance: 1.0
      transform_tolerance: 0.2
      enforce_path_inversion: false
      regenerate_noises: false
      retry_attempt_limit: 1
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # 비용 무게를 낮춘다: 기본값에서는 통로 안쪽 띠의 비용 때문에 경로를 못 따르고 앞뒤로 흔들렸다.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        critical_cost: 300.0
        consider_footprint: true  # 다각형 발자국(local_costmap)으로 본다
        collision_cost: 1000000.0
        near_goal_distance: 0.3
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.25
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.25
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.25
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025
      # 몸 모양에 가까운 다각형(base_footprint 틀). 회전 중심이 앞쪽이라 뒤 모서리까지 0.0845 m이다.
      # FollowPath 셋의 충돌 검사가 이 발자국을 쓴다. pode_fsm은 이 costmap에서 비용 99(내접) 이상을 막힘으로 본다.
      footprint: "[[0.040, 0.021], [0.036, 0.031], [0.029, 0.056], [-0.029, 0.056], [-0.049, 0.049], [-0.071, 0.042], [-0.076, 0.037], [-0.076, -0.037], [-0.071, -0.042], [-0.049, -0.049], [-0.029, -0.056], [0.029, -0.056], [0.036, -0.031], [0.040, -0.021]]"
      # 다각형이 몸을 덮으니 padding은 0
      footprint_padding: 0.0
      # 라이다가 2D라 voxel 대신 obstacle_layer를 쓴다
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: <robot_namespace>/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      # pode_fsm이 BLOCKED 판단에 costmap 전체를 받는다
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # NavFn은 점으로 계획하고 이 발자국은 inscribed 반지름으로만 쓴다.
      footprint: "[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]"
      # inscribed 0.07 m는 제자리 회전 반지름(0.0845 m)보다 작아, 벽에 붙은 경로 칸에서 돌면 닿을 수 있다.
      footprint_padding: 0.01
      resolution: 0.025
      track_unknown_space: true
      # 우회 경로 계산용 라이다 장애물 층
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: <robot_namespace>/map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: <robot_namespace>/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
      # Nav2 goal 경로(NavFn)만 쓴다. 15.0/0.15는 벽에서 0.10 m는 비용이 있고 0.20 m는 0이다. local은 0.15/3.0이다.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.15
      always_send_full_costmap: true
      # keepout(급행, 도크 구역)은 launch 인자 keepout_mask가 있을 때만 keepout.yaml로 더한다

# 관제가 compute_path_to_pose, is_path_valid를 부를 수 있게 띄운다
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # 막힌 goal의 대체점은 x·y 각 0.05 안(대각선 0.071 m)에서만 고른다. 넓히면 진열대 건너편 점도 잡힌다
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

# backup: 로봇단 교착 처리, 자가 복구, Retreat. wait: NavigateToPose BT 복구(spin은 뺌)
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false
