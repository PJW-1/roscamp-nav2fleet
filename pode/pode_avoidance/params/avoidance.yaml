# 회피 담당의 설정 파일. nav2.launch.py의 avoidance_package:=<패키지>로 같은 이름 파일을 바꿔 쓴다.
# 키는 follow_path_goal, vision_obstacles, peer_layer(생략 가능)뿐이다. 다른 키는 launch와 시험이 거부한다.

# 넓은 구역 Nav2 goal(MoveTo nav_goal)을 모는 컨트롤러(RPP). 속도 상한은 nav_max_speed를 따른다.
# 플러그인을 바꾸면 최고 속도를 nav_max_speed 이하로 직접 맞추고 주행 담당에게 알린다.
# 제자리 회전은 1.0 rad/s: Gazebo 구동 플러그인이 회전을 1.0 rad/s로 자른다.
follow_path_goal:
  plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
  desired_linear_vel: 0.12  # 순항 속도 (m/s)
  lookahead_dist: 0.15  # 앞보기 거리 (m)
  min_lookahead_dist: 0.10  # 앞보기 최소 (m)
  max_lookahead_dist: 0.25  # 앞보기 최대 (m)
  lookahead_time: 0.8
  use_velocity_scaled_lookahead_dist: true
  rotate_to_heading_angular_vel: 1.0
  transform_tolerance: 0.2
  min_approach_linear_velocity: 0.05
  approach_velocity_scaling_dist: 0.2
  use_collision_detection: true
  max_allowed_time_to_collision_up_to_carrot: 0.6  # 충돌 검사 앞보기 시간 (s)
  use_regulated_linear_velocity_scaling: true
  use_fixed_curvature_lookahead: false
  curvature_lookahead_dist: 0.6
  use_cost_regulated_linear_velocity_scaling: true
  regulated_linear_scaling_min_radius: 0.25
  regulated_linear_scaling_min_speed: 0.05
  use_rotate_to_heading: true
  allow_reversing: false
  rotate_to_heading_min_angle: 0.25
  max_angular_accel: 3.2
  max_robot_pose_search_dist: 1.4875
  cost_scaling_dist: 0.05
  cost_scaling_gain: 1.5
  inflation_cost_scaling_factor: 3.0
  interpolate_curvature_after_goal: false
  use_cancel_deceleration: false
  cancel_deceleration: 3.2

# vision 관측원: launch 인자 vision_obstacles:=true일 때 두 costmap 장애물 층에 들어간다(기본 꺼짐).
# 표시만 하고 지우지 않는다. 거리와 높이 값은 자리만 잡은 것이다.
vision_obstacles:
  topic: <robot_namespace>/vision_obstacles
  data_type: "PointCloud2"
  marking: true
  clearing: false
  obstacle_max_range: 1.5
  obstacle_min_range: 0.0
  min_obstacle_height: 0.0
  max_obstacle_height: 2.0
  expected_update_rate: 0.0
  observation_persistence: 0.5

# 다른 Pode의 몸을 costmap에 넣는 층(임시). launch 인자 peer_obstacles:=true일 때만 inflation_layer 앞에 들어간다.
# peers는 map 틀 점구름이라 obstacle_max_range를 경기장 대각선보다 크게 둔다.
# sweep은 inf 빔으로 로봇 둘레를 매번 지우고 peers를 다시 찍어, 지금 자리만 남긴다.
peer_layer:
  plugin: "nav2_costmap_2d::ObstacleLayer"
  enabled: true
  footprint_clearing_enabled: true
  observation_sources: peers sweep
  peers:
    topic: <robot_namespace>/peer_obstacles
    data_type: "PointCloud2"
    marking: true
    clearing: false
    obstacle_max_range: 10.0
    obstacle_min_range: 0.0
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0
    expected_update_rate: 0.0
    observation_persistence: 0.0
  sweep:
    topic: <robot_namespace>/peer_sweep
    data_type: "LaserScan"
    marking: false
    clearing: true
    inf_is_valid: true
    raytrace_max_range: 3.0
    raytrace_min_range: 0.0
    max_obstacle_height: 2.0
    expected_update_rate: 0.0
    observation_persistence: 0.0
