# 배치 v7의 장애물 한 판(사용자 2026-11-13 밤: 더 다양한 상황, 장애물이 생기면 로봇의 회피가 보이게).
# 모두 Nav2 goal 이음 위다: 고정 경로는 Gazebo에서 충돌 검사를 하지 않아 상자를 밀고 간다
# (fixed_line_collision_check 기본 끔). 형식은 d2_yard_express.yaml의 설명과 같다.
# 상자는 0.08 x 0.08로 작다: 로봇이 Nav2로 스스로 돌아가는 것을 보려는 것이다.
#  1. 남쪽 통로 가운데(E-3 -> Q2의 절반, (1.15, 0.215)): 통로 폭 0.365에서 남쪽 0.175, 북쪽 0.11이
#     남는다. 로봇은 남쪽 틈으로 지나거나 가운데 통로로 스스로 돈다(가로 0.18 상자로 통로를 막았던
#     Gazebo 판에서 Nav2가 가운데 통로로 돌아 Q2에 닿았다). 그래도 서면 관제가 M_E로 돌린다.
#  2, 3. 서쪽 마당((0.395, 0.445), (0.28, 0.445)): 넓은 곳이라 상자 옆으로 돌아간다. 로봇이 0.35 m
#     안에 20초 넘게 있으면 그 상자는 놓지 않으므로 두 번 넣었다.
#  4. 가운데 통로(O_IN -> M_E의 0.4): 우회로 위. 평소에는 아무도 지나지 않는다.
# 480초마다 되풀이한다.
repeat_every_s: 480
size_m: [0.08, 0.08, 0.25]
obstacles:
  - {at_s: 60, link: [E-3, Q2], fraction: 0.5, duration_s: 90}
  - {at_s: 180, link: [O_OUT, E-3], fraction: 0.5, duration_s: 60}
  - {at_s: 270, link: [O_IN, E-1], fraction: 0.5, duration_s: 60}
  - {at_s: 370, link: [O_IN, M_E], fraction: 0.4, duration_s: 60}
