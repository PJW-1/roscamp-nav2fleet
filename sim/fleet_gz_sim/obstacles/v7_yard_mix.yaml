# 배치 v7 장애물 한 판: Nav2 goal 이음 위에 0.08 x 0.08 상자 넷(남쪽 통로, 서쪽 마당 둘, 가운데 통로)을 480초마다 되풀이한다.
# 형식은 d2_yard_express.yaml의 설명과 같다.
repeat_every_s: 480
size_m: [0.08, 0.08, 0.25]
obstacles:
  - {at_s: 60, link: [E-3, Q2], fraction: 0.3, duration_s: 90}
  - {at_s: 180, link: [O_OUT, E-3], fraction: 0.5, duration_s: 60}
  - {at_s: 270, link: [O_IN, E-1], fraction: 0.5, duration_s: 60}
  - {at_s: 370, link: [O_IN, M_E], fraction: 0.4, duration_s: 60}
