# 배치 v7의 장애물 한 판(사용자 2026-11-13 밤: 더 다양한 상황). 모두 Nav2 goal 이음 위다: 고정 경로는
# Gazebo에서 충돌 검사를 하지 않아 상자를 밀고 간다(fixed_line_collision_check 기본 끔).
# 형식은 d2_yard_express.yaml의 설명과 같다. 상자는 이음 방향으로 0.08, 가로로 0.18이다.
#  1. 남쪽 통로 가운데(E-3 -> Q2의 절반, (1.14, 0.27)): 가로 0.18이 y 0.18~0.36을 덮어 진열대 아래
#     통로를 막는다. 막힌 로봇은 BLOCKED를 보고하고 관제가 가운데 통로(O_IN -> M_E -> Q2)로 돌린다.
#  2. 서쪽 마당(O_OUT -> E-2의 절반, (0.27, 0.48)): 넓은 곳이라 Nav2가 스스로 돌아간다.
#  3. 가운데 통로(O_IN -> M_E의 0.4, (0.90, 0.63)): 우회로 위. 평소에는 아무도 지나지 않는다.
# 480초마다 되풀이한다.
repeat_every_s: 480
size_m: [0.08, 0.18, 0.25]
obstacles:
  - {at_s: 60, link: [E-3, Q2], fraction: 0.5, duration_s: 90}
  - {at_s: 220, link: [O_OUT, E-2], fraction: 0.5, duration_s: 60}
  - {at_s: 340, link: [O_IN, M_E], fraction: 0.4, duration_s: 60}
