# 배치 v7 가운데 통로 재현(2026-11-17, docs/worklog_corridor_costmap_ab_2026-11-17.md 8절).
# v7_yard_mix의 상자 4와 같은 자리·크기: O_IN -> M_E의 0.4, 약 (0.952, 0.595), 0.08 x 0.08.
# 한 번 놓고 판 내내(1800 s) 둔다. 되풀이하지 않는다. 형식은 d2_yard_express.yaml의 설명과 같다.
# at_s 30: 시뮬 절대 시각이다. sim_obstacles의 첫 tick이 이보다 늦으면 건너뛰고 되풀이도 없어 상자가
# 없다(그러면 drive_check --wait-box가 멈춘다). 로봇이 0.35 m 안에 있으면 기다리고 20 s 뒤 버린다.
# O_IN 한가운데 선 로봇은 상자에서 0.463 m라 막지 않는다(상자 쪽으로 0.113 m 넘게 치우치면 막는다).
# drive_check --wait-box로 상자가 놓인 뒤에 출발시킨다(먼저 출발해 통로를 지나면 놓기가 밀리거나 버려진다).
size_m: [0.08, 0.08, 0.25]
obstacles:
  - {at_s: 30, link: [O_IN, M_E], fraction: 0.4, duration_s: 1800}
