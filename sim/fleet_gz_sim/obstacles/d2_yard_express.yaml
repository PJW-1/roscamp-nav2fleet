# 시뮬 장애물 한 판(D2): 마당에 상자 하나, 급행에 상자 하나를 놓았다가 치운다.
#   repeat_every_s: 이 주기마다 목록 전체를 되풀이(없으면 한 번)
#   size_m: 상자 크기 [x, y, z] m(기본 [0.12, 0.12, 0.25])
#   at_s: 시뮬 시각(초, 주기 안). link: [from, to] 지점. fraction: from에서 to까지 비율(기본 0.5). duration_s: 치울 때까지(초)
# 로봇이 clearance_m 안이면 비킬 때까지 기다리고 max_delay_s가 지나면 버린다. 같은 연결에 시간이 겹치는 항목은 거부한다.
repeat_every_s: 300
size_m: [0.12, 0.12, 0.25]
obstacles:
  - {at_s: 60, link: [N_W, N_E], duration_s: 120}    # 마당 가운데
  - {at_s: 150, link: [X_W, X_E], duration_s: 120}   # 급행 가운데
