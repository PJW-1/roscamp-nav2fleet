# 시뮬 장애물 기본 일정(sim_obstacles 노드). 바쁜 레인에 상자를 잠깐 놓았다가 치운다.
#
#   repeat_every_s: 이 주기마다 목록 전체를 다시 한다(없으면 한 번). 항목은 한 주기 안에서 끝나야 한다
#   size_m: 상자 크기 [x, y, z] m(없으면 [0.12, 0.12, 0.25]). z는 라이다 높이(약 0.125 m)보다 높게
#   obstacles: 항목마다
#     at_s: 시뮬 시각(초, 주기 안). 노드가 뜨기 전 시각의 항목은 건너뛴다
#     lane: [from, to] 지점. 맵에 어느 방향으로든 있는 레인. 로그와 상자 방향만 이 순서를 따른다
#     fraction: from에서 to까지 간 비율(0과 1 사이, 없으면 0.5)
#     duration_s: 놓은 뒤 치울 때까지(초). 관제의 막힘 한도 60 s보다 넉넉히 짧게
# 로봇이 clearance_m 안에 있으면 비킬 때까지 기다리고, max_delay_s가 지나면 버린다.
# 같은 레인(방향 무관)에 시간이 겹치는 항목은 거부한다.
repeat_every_s: 300
size_m: [0.12, 0.12, 0.25]
obstacles:
  - {at_s: 40, lane: [W, A], duration_s: 25}
  # 0.5면 N→S 교차점이라 두 레인을 다 막는다. 교차점에서 0.275 m 떨어뜨린다
  - {at_s: 110, lane: [A, B], fraction: 0.25, duration_s: 30}
  - {at_s: 180, lane: [B, R], duration_s: 25}
  - {at_s: 250, lane: [S, L], duration_s: 30}
