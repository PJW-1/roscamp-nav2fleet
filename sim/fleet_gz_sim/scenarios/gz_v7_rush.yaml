# 배치 v7의 주행 성능 판(2026-11-14, 사용자: 포트폴리오용이라 성능에 비중). gz_v7과 같은 경기장과
# 로봇이고, 주문 12건이 처음 12초 안에 모두 들어온다. 고장(배터리, 팔)이 없고 장애물도 따로 주지
# 않는다. 그래서 걸린 시간(summary.json의 duration_s)이 곧 처리 성능이다: 세 로봇이 쉬지 않고
# 주문을 처리하는 동안 주행 속도, 회전, 도착, 구역 잠금이 얼마나 빠른지가 드러난다.
# 품목 수는 gz_v7_varied와 같다(1~4개). 팔이 품목마다 4초 쓰는 것은 주행과 상관없이 고정이다.
#   ros2 launch fleet_gz_sim gz.launch.py layout:=v7 scenario:=gz_v7_rush sim_dock_stub:=true
map: v7
seed: 72
timeout_s: 2400
stock: {arm1: {A: 30, B: 30}, arm2: {C: 30, D: 30}}
orders:
  - {at_s: 0, id: S-001, items: {A: 1}}
  - {at_s: 1, id: S-002, items: {C: 2, D: 1}}
  - {at_s: 2, id: S-003, items: {B: 1}}
  - {at_s: 3, id: S-004, items: {A: 2, C: 2}}
  - {at_s: 4, id: S-005, items: {D: 1}}
  - {at_s: 5, id: S-006, items: {B: 1, C: 1}}
  - {at_s: 6, id: S-007, items: {A: 1}}
  - {at_s: 7, id: S-008, items: {D: 2}}
  - {at_s: 8, id: S-009, items: {B: 3}}
  - {at_s: 9, id: S-010, items: {C: 1}}
  - {at_s: 10, id: S-011, items: {A: 1, B: 1, C: 1, D: 1}}
  - {at_s: 11, id: S-012, items: {D: 1}}
robots:
  pinky1: {start: P-3}
  pinky2: {start: P-2}
  pinky3: {start: P-1}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 12
  orders_partial: 0
  orders_held: 0
  parked_while_backlog: null
  robot_idle: null
  events_include: [ORDER_BOUND, ORDER_SHIPPED]
