# 실제 경기장(real_arena) 리허설: 핑키 3대(실전과 같다), 주문 8건이 20초마다 들어온다.
# 로봇은 대기 칸 P-1, P-2(남쪽), P-3(bin 남쪽)에서 출발해 서쪽 WORK와 동남쪽 OUTBOUND를 오간다. OUTBOUND는
# box_small 북쪽 틈으로 들어가 table_2 남쪽과 가운데 틈으로 나오는 한 방향 고리다.
# 자유바닥 전용이고, 도킹은 sim_dock_stub:=true가 있어야 끝까지 돈다. 바닥이 좁아 잠금을 줄인
# 관제 파라미터(fleet_params_real_arena)와 느린 속도(0.15 m/s)로 돈다. 틈 옆 여유가 5 cm라
# 라이다 잡음이 벽을 발자국 안에 찍으므로 RPP 충돌 검사를 끈다(nav_collision_check:=false).
# 집에서 돌리기: 이 레포를 colcon build로 빌드하고(시뮬 월드와 지도도 함께 설치된다), 실물
# 네트워크가 아닌 도메인에서(6은 launch가 막는다, 시뮬은 58) 이 컴퓨터 안에서만 돌린다.
#   export ROS_DOMAIN_ID=58 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
#   ros2 launch fleet_gz_sim gz.launch.py scenario:=gz_real_arena traffic_mode:=freefloor \
#       sim_dock_stub:=true fleet_params_file:=fleet_params_real_arena nav_max_speed:=0.15 \
#       nav_collision_check:=false
map: real_arena
seed: 61
speed_factor: 5.0
timeout_s: 1200
stock: {arm1: {A: 20, B: 20}, arm2: {C: 20, D: 20}}
orders:
  - {at_s: 0, id: R-001, items: {A: 1, C: 1}}
  - {at_s: 20, id: R-002, items: {B: 1}}
  - {at_s: 40, id: R-003, items: {D: 1, A: 1}}
  - {at_s: 60, id: R-004, items: {C: 1}}
  - {at_s: 80, id: R-005, items: {B: 1, D: 1}}
  - {at_s: 100, id: R-006, items: {A: 1}}
  - {at_s: 120, id: R-007, items: {C: 1, B: 1}}
  - {at_s: 140, id: R-008, items: {D: 1}}
robots:
  pinky1: {start: P-2}
  pinky2: {start: P-1}
  pinky3: {start: P-3}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 8
  orders_partial: 0
  orders_held: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED]
