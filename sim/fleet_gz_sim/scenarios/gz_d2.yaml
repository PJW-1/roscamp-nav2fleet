# Gazebo 배치 D2: 북쪽 벽 급행 + 넓은 마당. 핑키 3대가 주차 지점에서 출발해 주문 8건을 처리한다.
# gz.launch.py layout:=d2 가 쓴다. map은 배치 이름이다(fleet_core/data/fleet_map_d2.yaml).
# 로봇 고장은 넣지 않는다(진짜 pinky_fsm에는 일으킬 곳이 없다). 시각은 Gazebo 시계 0부터.
map: d2
seed: 7
timeout_s: 1800
stock: {arm1: {A: 6, B: 6}, arm2: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 20, id: O-003, items: {A: 2}}
  - {at_s: 40, id: O-004, items: {C: 1, D: 1, A: 1}}
  - {at_s: 60, id: O-005, items: {B: 2, C: 2}}
  - {at_s: 90, id: O-006, items: {D: 1}}
  - {at_s: 120, id: O-007, items: {A: 1, B: 1}}
  - {at_s: 150, id: O-008, items: {C: 2}}
robots:
  pinky1: {start: P-1}
  pinky2: {start: P-2}
  pinky3: {start: P-3}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 8
  orders_partial: 0
  orders_held: 0
