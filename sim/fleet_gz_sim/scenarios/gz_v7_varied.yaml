# 배치 v7의 여러 상황 섞은 판(사용자 2026-11-13 밤: 더 다양한 상황이 나오게). gz_v7과 같은 경기장과
# 로봇이고, 다른 점은 셋이다.
#  - 주문 12건이 몰려서 들어왔다가 쉰다(0~5초에 셋, 90초대에 둘, 180초대에 셋, 그 뒤 띄엄띄엄).
#    품목 수가 1~4개로 달라 WORK에 머무는 시간이 다르고, 줄(Q2 -> Q1)이 찼다 비었다 한다.
#  - 배터리 부족: 로봇마다 한 번, 서로 다른 시각(70, 240, 400초)에 떨어져 충전 칸으로 가고 충전 시간도
#    다르다(30, 60, 40초). 일하던 로봇이 빠지고 남은 로봇이 주문을 이어받는다.
#  - 장애물은 따로 준다: obstacles:=v7_yard_mix(남쪽 통로를 막는 상자 -> 가운데 통로 M_E로 우회,
#    서쪽 마당의 상자 -> Nav2가 돌아감, 가운데 통로의 상자).
# 팔 고장(arm_fail, swap_partial)은 넣지 않았다: Gazebo에서 판정이 어떻게 나오는지 확인하지 못했다.
# 충전하러 가는 로봇은 주문이 밀려도 주차로 가므로 parked_while_backlog는 보지 않는다.
#   ros2 launch fleet_gz_sim gz.launch.py layout:=v7 scenario:=gz_v7_varied obstacles:=v7_yard_mix \
#       battery_low_pct:=20 sim_dock_stub:=true
map: v7
seed: 71
timeout_s: 2400
stock: {arm1: {A: 30, B: 30}, arm2: {C: 30, D: 30}}
orders:
  - {at_s: 0, id: V-001, items: {A: 1}}
  - {at_s: 0, id: V-002, items: {C: 2, D: 1}}
  - {at_s: 5, id: V-003, items: {B: 1}}
  - {at_s: 90, id: V-004, items: {A: 2, C: 2}}
  - {at_s: 95, id: V-005, items: {D: 1}}
  - {at_s: 180, id: V-006, items: {B: 1, C: 1}}
  - {at_s: 185, id: V-007, items: {A: 1}}
  - {at_s: 190, id: V-008, items: {D: 2}}
  - {at_s: 330, id: V-009, items: {B: 3}}
  - {at_s: 420, id: V-010, items: {C: 1}}
  - {at_s: 425, id: V-011, items: {A: 1, B: 1, C: 1, D: 1}}
  - {at_s: 520, id: V-012, items: {D: 1}}
robots:
  pinky1: {start: P-3}
  pinky2: {start: P-2}
  pinky3: {start: P-1}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults:
  - {at_s: 70, robot: pinky2, type: low_battery, duration_s: 30}
  - {at_s: 240, robot: pinky1, type: low_battery, duration_s: 60}
  - {at_s: 400, robot: pinky3, type: low_battery, duration_s: 40}
expect:
  all_orders_finished: true
  orders_shipped: 12
  orders_partial: 0
  orders_held: 0
  parked_while_backlog: null
  robot_idle: null
  events_include: [ORDER_BOUND, ORDER_SHIPPED]
