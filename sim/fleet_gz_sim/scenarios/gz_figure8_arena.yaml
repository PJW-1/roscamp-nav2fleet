# 8자 경기장(figure8_arena) 리허설: 핑키 3대, 주문 8건이 20초마다 들어온다(gz_real_arena와 같은 주문).
# 벽은 실제 경기장과 같고 섬 둘을 두어 바닥이 8자다. 로봇은 섬에 판 주차 칸 P-1, P-2(서쪽 섬),
# P-3(동쪽 섬)에서 출발해 서쪽 WORK와 동쪽 OUTBOUND를 오가며, 두 스테이션 사이 길이 가운데에서
# 엇갈린다(sim/fake_robots/maps/figure8_arena.yaml 그림).
# 자유바닥 전용이고, 도킹은 sim_dock_stub:=true가 있어야 끝까지 돈다. 로봇과 잠금은 실제 경기장과
# 같아 관제 파라미터도 fleet_params_real_arena를 쓰고 0.15 m/s로 돈다. 통로가 0.30 m라 RPP 충돌
# 검사를 끈다(nav_collision_check:=false, gz_real_arena와 같은 이유).
#   export ROS_DOMAIN_ID=58 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
#   ros2 launch fleet_gz_sim gz.launch.py scenario:=gz_figure8_arena traffic_mode:=freefloor \
#       sim_dock_stub:=true fleet_params_file:=fleet_params_real_arena nav_max_speed:=0.15 \
#       nav_collision_check:=false
# 알려진 문제(2026-11-10): 두 로봇이 서로를 기다리는 교착이 풀리지 않았다. Gazebo 한 번(자리는
# 확인 안 함)과 머리 없는 씨앗 20개 중 2개(OUTBOUND 도크 근처)다. 실험용 지도다
# (docs/worklog_freefloor_2026-11-10.md 3절).
map: figure8_arena
seed: 61
speed_factor: 5.0
timeout_s: 1200
stock: {arm1: {A: 20, B: 20}, arm2: {C: 20, D: 20}}
orders:
  - {at_s: 0, id: R-001, items: {A: 1, C: 1}}
  - {at_s: 20, id: R-002, items: {B: 1}}
  - {at_s: 40, id: R-003, items: {D: 1, A: 1}}
  - {at_s: 60, id: R-004, items: {C: 1}}
  - {at_s: 80, id: R-005, items: {B: 1, D: 1}}
  - {at_s: 100, id: R-006, items: {A: 1}}
  - {at_s: 120, id: R-007, items: {C: 1, B: 1}}
  - {at_s: 140, id: R-008, items: {D: 1}}
robots:
  pinky1: {start: P-2}
  pinky2: {start: P-1}
  pinky3: {start: P-3}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
expect:
  all_orders_finished: true
  orders_shipped: 8
  orders_partial: 0
  orders_held: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED]
