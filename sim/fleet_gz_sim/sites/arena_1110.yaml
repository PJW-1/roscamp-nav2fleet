# 실측 경기장 (2026-11-10). 실물 핑키의 라이다로 잰 벽 안쪽 2.00 x 1.00 m와 그날 안에 놓여 있던
# 물체 둘(docs/실측_2026-11-10.md). 물체는 라이다 점의 바깥 테두리를 5 cm 격자에 맞췄다
# (실측 x 0.64-0.83, y 0.43-0.64와 x 1.04-1.32, y 0.39-0.60). 원점은 SLAM을 시작한 구석의
# 벽 안쪽 모서리이고 x는 긴 변이다.
#   두 물체는 워크셀의 팔 둘이고 그 사이 틈 0.20 m(실측 0.21 m)가 WORK 도크다(사용자 결정
#   2026-11-10). 틈 가운데 선은 양쪽 물체에서 0.10 m다. 핑키는 너비 0.11 m, 제자리 회전 반지름
#   0.083 m라 가운데 선 위에서는 양옆 4.5 cm, 돌 때 1.7 cm가 남는다.
#   둘레 통로: 남쪽 0.40-0.45 m, 북쪽 0.35-0.40 m, 서쪽 0.65 m, 동쪽 0.70 m.
# 레인은 표시용이고 관제는 자유바닥(pc/fleet_core/fleet_core/data/floor_map_arena_1110.yaml)으로 돈다.
lane_map: arena_1110           # sim/fake_robots/maps/의 이름
lane_clearance_m: 0.10         # 틈 안 WORK 선이 물체에서 0.10 m다 (real_arena는 0.12)
bounds_m: [0.0, 0.0, 2.00, 1.00] # 벽 안쪽 면
boxes:
  - {name: object_west, kind: block, x0: 0.65, y0: 0.45, x1: 0.85, y1: 0.65}
  - {name: object_east, kind: block, x0: 1.05, y0: 0.40, x1: 1.30, y1: 0.60}
