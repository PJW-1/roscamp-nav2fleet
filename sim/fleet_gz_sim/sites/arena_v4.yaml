# 실물 경기장 네 번째 배치 (v4, 2026-11-10 밤). 07d7 핑키가 20곳에 서서 읽은 라이다 스캔으로 만든
# 지도다(/home/ane/ros2camp/real_arena_slam_v4_2026-11-10: build_v4.py가 1 cm 지도를 만들고
# pgm_to_site.py가 그 지도의 물체 칸을 아래 상자로 옮겼다). 손으로 고치지 않는다.
#   - 벽 안쪽 1.98 x 0.99 m. 07d7의 라이다는 벽을 휘게 읽지 않고(거리 오차 1 mm 미만) 1.977 x 0.991 m로
#     읽는다. 다른 두 라이다도 거리 오차를 빼면 1.98 x 0.99에서 1.00 m다(range_offset.py).
#     v3까지의 2.00 x 1.02 m는 2에서 3 cm 컸다.
#   - 물체 넷. 줄마다 x 범위가 같은 1 cm 줄들을 한 상자로 묶어서, 생성기의 1 cm 지도는 스캔 지도와
#     칸 하나까지 같다(생성기는 상자가 걸친 칸을 점유로 본다).
#   - 통로(스캔 점 사이 실측): 물체 4 남쪽 0.26, 북쪽 0.24, 가운데(물체 2·3과 4 사이) 0.25,
#     물체 2와 3 사이 0.21, 물체 3 북쪽 0.17, 물체 1과 2 사이 0.20, 물체 1과 3 사이 0.19 m.
#     물체 2 남쪽(0.03 m)은 막혔다. 동쪽 0.75 m는 비어 있다.
# 레인은 표시와 거리 계산용이고 관제는 자유바닥(pc/fleet_core/fleet_core/data/floor_map_arena_v4.yaml)으로 돈다.
