# RL 주행 정책 controller 둘을 더 띄운다(시뮬 전용 nav_overrides). controller_plugins는 목록이라 통째로 다시 적는다.
# - FollowPathRL: RL 기본. RotationShim이 정책을 감싸 0.785 rad보다 틀어지면 제자리에서 돌고, 0.39 rad 안으로 들어오면 정책에 넘긴다.
# - FollowPathRLAlone: 감싸지 않은 같은 정책(비교용).
# 고르기: ros2 topic pub --once /<로봇>/controller_selector std_msgs/msg/String "{data: FollowPathRL}" (되돌리기 data: FollowPathGoal)
# 실물 nav2_params.yaml에는 아직 넣지 않는다.
# 정책 숫자와 목표점 규칙은 정책 폴더의 policy_spec.json에 있다. goal_rule, lookahead_dist를 적으면 명세를 덮고 WARN을 남긴다.
controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath", "FollowPathThrough", "FollowPathReverse", "FollowPathGoal",
                         "FollowPathMPPI", "FollowPathRL", "FollowPathRLAlone"]
    FollowPathRL:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "pode_rl_controller::FollowPathRL"
      angular_dist_threshold: 0.785  # 45°. MPPI는 0.25
      angular_disengage_threshold: 0.39
      forward_sampling_distance: 0.15
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true  # goal 마지막 방향 맞추기도 shim이 먼저 한다
      # shim의 회전 충돌 검사가 거부하면 돌던 중이라도 그 주기에 정책으로 넘긴다
      policy: "store_arena_4b"  # share/pode_rl_controller/policies/<이름> 또는 절대 경로
      scan_topic: "scan"
      scan_timeout: 0.5
      transform_tolerance: 0.2
      intra_op_threads: 1
      rotate_gain: 1.5
      log_period: 1.0
      rear_stop_range: 0.0  # 후진 막기(기본 끔). 벽 스침 대책이 아니다
      rear_half_width_deg: 30.0
    FollowPathRLAlone:
      plugin: "pode_rl_controller::FollowPathRL"
      policy: "store_arena_4b"
      scan_topic: "scan"
      scan_timeout: 0.5
      transform_tolerance: 0.2
      intra_op_threads: 1
      rotate_gain: 1.5
      log_period: 1.0
      rear_stop_range: 0.0
      rear_half_width_deg: 30.0
