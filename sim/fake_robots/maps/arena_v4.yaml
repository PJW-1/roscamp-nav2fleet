# 실물 경기장 지도 v4 (2026-11-10 밤, 네 번째 배치: 벽 안쪽 1.98 x 0.99 m, 물체 넷). 07d7 핑키의
# 라이다 스캔 20곳으로 만든 지도다(sim/fleet_gz_sim/sites/arena_v4.yaml).
# 동선은 사용자가 정했다(2026-11-10): 구조도처럼 8자를 그리고, 출고 구간은 한쪽으로 들어가 반대쪽으로
# 나오며, 가운데 통로를 따로 들르는 지점 없이 지난다. 자리는 v3 그대로다(출고는 서쪽 벽 가운데,
# 작업 도크는 남동쪽 구석, 대기는 북동쪽).
#  - 동쪽 고리(시계 방향): 북쪽 통로를 동쪽으로 나와 대기 자리나 작업 도크로, 작업을 마치면 남쪽 통로를
#    서쪽으로 가서 가운데 통로를 올라간다
#  - 서쪽 고리(시계 반대 방향): 가운데 통로 끝에서 물체 3 북쪽 통로로 서쪽 구역에 들어가 출고 도크를
#    북쪽에서 남쪽으로 지나고, 물체 1과 2 사이, 물체 2와 3 사이 틈을 거쳐 가운데 통로로 돌아온다
#  - 가운데 통로는 두 고리가 같이 쓰고 둘 다 북쪽으로만 올라간다(8자의 교차점)
#  - 서쪽 구역으로 통하는 길은 모두 0.2 m 이하라 들어가는 길과 나오는 길이 둘 다 바닥 지도의 좁은 선이다
#  - 바닥 지도의 고정 선은 출고로 가는 선이 S1에서 시작하고 나오는 선이 E1에서 끝난다: 세 통로와 서쪽
#    구역에서는 늘 한 방향 선 위를 달리고, 자유 경로는 동쪽 빈 곳에서만 쓴다
#  - 아래 레인은 표시와 거리 계산용이다. 꺾이는 점(QO, X1, X2, M2에서 E1)은 바닥 지도의 선과 몇 cm 다르다:
#    로봇은 바닥 지도의 선을 따라 달린다
#  - 대기 자리는 한 줄 대기열이다: E1 쪽에서 들어와 P-3이 먼저 나간다
#
#   y
#  0.905  QO <--- N1 <------ M2 ------> E1    P-1 ----- P-2
#  0.80    |      [3] 위 통로  ^   [4] 북쪽 통로            |
#  0.52    O (출고)   [1] [3]  |                           P-3
#  0.445   |        X3 ------> M1   [4]           QW
#  0.27   X1 --> X2 (물체 1과 2 사이)                 \
#  0.125              [2]     S2 <------------ S1 <--- W (작업, 0.17)
#        0.17    0.59 0.65   0.97            1.32  1.50   1.78  x
floor_map: floor_map_arena_v4.yaml  # free-floor map (traffic_mode freefloor), in fleet_core/data
half_width_m: 0.05
lane_entry_m: 0.25
origin_m: [0.0, 0.0]
bundle_two_way: false
waypoints:
  - {id: QW, x: 1.50, y: 0.45}      # WORK 대기 지점 (동쪽 빈 곳의 가운데)
  - {id: W, x: 1.78, y: 0.17}       # WORK 도크 (남동쪽 구석)
  - {id: S1, x: 1.32, y: 0.125}     # 남쪽 통로 동쪽 입구: 출고로 가는 선의 시작
  - {id: S2, x: 0.97, y: 0.125}     # 가운데 통로 남쪽 끝
  - {id: M1, x: 0.97, y: 0.445}     # 가운데 통로, 물체 2와 3 사이 틈 앞: 두 고리가 만나는 곳
  - {id: M2, x: 0.97, y: 0.905}     # 가운데 통로 북쪽 끝: 두 고리가 갈라지는 곳
  - {id: N1, x: 0.60, y: 0.905}     # 물체 3 북쪽 통로를 지난 곳
  - {id: QO, x: 0.17, y: 0.80}      # OUTBOUND 대기 지점 (북서쪽 구석)
  - {id: O, x: 0.17, y: 0.52}       # OUTBOUND 도크 (서쪽 벽 가운데)
  - {id: X1, x: 0.20, y: 0.25}      # 출고를 남쪽으로 나온 곳
  - {id: X2, x: 0.571, y: 0.237}    # 물체 1과 2 사이 틈 앞 (틈의 가운데 선 위, X3까지 0.21 m)
  - {id: X3, x: 0.649, y: 0.432}    # 그 틈을 지난 곳 (물체 2와 3 사이 틈의 서쪽 끝)
  - {id: E1, x: 1.30, y: 0.875}     # 물체 4 북쪽 통로의 동쪽 출구
  - {id: P-1, x: 1.57, y: 0.87}     # 북쪽 벽 앞
  - {id: P-2, x: 1.86, y: 0.87}     # 북동쪽 구석
  - {id: P-3, x: 1.86, y: 0.58}     # 동쪽 벽 앞
lanes:
  - {from: QW, to: W}
  - {from: W, to: S1}
  - {from: S1, to: S2}
  - {from: S2, to: M1}
  - {from: M1, to: M2}              # 가운데 통로: 두 고리가 같이 쓴다
  - {from: M2, to: N1}
  - {from: N1, to: QO}
  - {from: QO, to: O}
  - {from: O, to: X1}
  - {from: X1, to: X2}
  - {from: X2, to: X3}
  - {from: X3, to: M1}
  - {from: M2, to: E1}
  - {from: E1, to: QW}
two_way:  # 대기 자리는 북쪽과 동쪽 벽을 따라 한 줄로 있다
  BAY1: [E1, P-1]
  BAY2: [P-1, P-2]
  BAY3: [P-2, P-3]
  EAST: [P-3, QW]
stations:
  WORK: {dock: W, queue: [[QW, W]], commit: W, server: workcell, arms: [arm1, arm2], action: fill}
  OUTBOUND: {dock: O, queue: [[QO, O]], commit: O, server: arm3, arms: [arm3], action: swap}
parking: [P-1, P-2, P-3]
