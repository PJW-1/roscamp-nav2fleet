# 길 막힘(계약 5절): basic_orders에 pinky1 앞 물체 15초를 더했다.
# pinky1은 BLOCKED로 보고하고, 관제는 blocked_mark_s 뒤 그 길을 막힘으로 표시하고
# 다른 길을 고른다(ZONE_MARKED_BLOCKED). 주문은 모두 출고된다. pinky3은 2초 동안 LOCALIZING이다.
# 구역 관제(D2)에서 pinky1은 처음에 W_Q에서 줄을 서 있다가 23초쯤 작업 도크로 간다. 그래서 물체는
# 그 길 위인 24초에 둔다(레인 관제 때는 8초에 이미 가고 있었다).
seed: 7
speed_factor: 5.0
timeout_s: 900
stock: {arm1: {A: 6, B: 6}, arm2: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 2}}
  - {at_s: 20, id: O-004, items: {C: 1, D: 1, A: 1}}
  - {at_s: 40, id: O-005, items: {B: 2, C: 2}}
  - {at_s: 60, id: O-006, items: {D: 1}}
robots:
  pinky1: {start: P-1, speed_mps: 0.20, pose_noise_m: 0.03}
  pinky2: {start: P-2, speed_mps: 0.18, pose_noise_m: 0.03}
  pinky3: {start: P-3, speed_mps: 0.20, pose_noise_m: 0.03, localizing_s: 2.0}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults:
  - {at_s: 24.0, robot: pinky1, type: blocked, duration_s: 15.0}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다(1.1 지시서 H2)
  all_orders_finished: true
  orders_shipped: 6
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  dual_arm_overlaps: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  events_include: [ORDER_BOUND, ORDER_SHIPPED, DOCKED, ZONE_MARKED_BLOCKED]
  event_counts: {ORDER_BOUND: 6, COMM_LOST: 0, GOAL_RETRY: 0, GOAL_STALLED: 0, GOAL_FAILED: 0, ROBOT_NOT_REPORTING: 0}
  order_results: {O-001: SHIPPED, O-002: SHIPPED, O-003: SHIPPED, O-004: SHIPPED, O-005: SHIPPED, O-006: SHIPPED}
