# pode1이 O-002를 싣고 출고 도크에 선 지 4초 뒤에 영영 멈추고 응답이 끊긴다(D2, 구역 관제).
# 시각이 아니라 사건(DOCKED at OUTBOUND)에서 잰다: 로봇 속도가 바뀌면 도크에 닿는 때도 바뀐다
# (70초로 두었을 때 속도 0.12에서는 닿기 전에 멈춰 출고가 1건이었다). 4초 뒤에는 도크에서
# 교체 중이다. OUT_DOCK을 쥔 채 남는다.
# pode1은 OUT_DOCK, J_E, HALL을 쥔 채 남는다. 출고 도크가 하나뿐이라 나머지는 그 앞에 줄을 선다:
# pode3은 O_Q에서, 다음 주문을 채운 pode2는 주차 자리에서 출고 도크를 기다린다(DOCK_QUEUED).
# 더는 출고할 수 없다: 출고 2건.
# 플릿 매니저는 경고(pode1은 COMM_LOST)를 내고 구역을 계속 쥐어야 한다.
# (레인 관제 때는 모두가 AVENUE 레인 하나를 기다려 ZONE_WAIT였다. D2에서 막히는 것은 도크다)
map: d2  # D2 배치용 시나리오(기본 배치는 v7)
seed: 5
speed_factor: 5.0
timeout_s: 400
stock: {arm1: {A: 6, B: 6}, arm2: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 2}}
  - {at_s: 20, id: O-004, items: {C: 1, D: 1, A: 1}}
  - {at_s: 40, id: O-005, items: {B: 2, C: 2}}
  - {at_s: 60, id: O-006, items: {D: 1}}
robots:
  pode1: {start: P-1, speed_scale: 1.0, pose_noise_m: 0.03}
  pode2: {start: P-2, speed_scale: 0.9, pose_noise_m: 0.03}
  pode3: {start: P-3, speed_scale: 1.0, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults:
  - {at_s: 4, robot: pode1, type: stuck, after_event: DOCKED, after_detail: "at OUTBOUND"}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다
  all_orders_finished: false
  orders_shipped: 2
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  events_include: [COMM_LOST, DOCK_QUEUED]
  event_counts: {COMM_LOST: 1, ROBOT_NOT_REPORTING: 0}
  timed_out: true
  order_results: {O-001: SHIPPED, O-002: SHIPPED}
