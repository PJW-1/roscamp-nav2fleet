# 운영자가 빈 로봇을 치운 뒤 다시 투입한다: pode2가 O-001을 출고한 2.5초 뒤 들어내 confirm_clear로 푼다.
# 160초에 pode2를 P-1에 다시 놓고, 200초에 주문 넷이 와서 pode2도 주문을 받아 끝내야 한다.
map: d2  # D2 배치용 시나리오(기본 배치는 v7)
seed: 31
speed_factor: 5.0
timeout_s: 900
stock: {arm_left: {A: 8, B: 8}, arm_right: {C: 8, D: 8}}
orders:
  - {at_s: 0, id: O-001, items: {A: 1, C: 1}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 1}}
  - {at_s: 200, id: O-004, items: {C: 1, D: 1}}
  - {at_s: 200, id: O-005, items: {B: 1}}
  - {at_s: 200, id: O-006, items: {A: 1, D: 1}}
  - {at_s: 200, id: O-007, items: {C: 1}}
robots:
  pode1: {start: P-1, speed_scale: 1.0, pose_noise_m: 0.03}
  pode2: {start: P-2, speed_scale: 0.9, pose_noise_m: 0.03}
  pode3: {start: P-3, speed_scale: 1.0, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 1.0, error_cm: 1.0}
faults:
  - {at_s: 2.5, robot: pode2, type: operator_remove, after_event: ORDER_SHIPPED}
  - {at_s: 160, robot: pode2, type: operator_reinstate, start: P-1, basket: EMPTY}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다
  all_orders_finished: true
  orders_shipped: 7
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  bound_after_reinstate_min: 1
  shipped_after_reinstate_min: 1
  events_include: [ZONES_CLEARED, ROBOT_REINSTATED]
  event_counts: {ZONES_CLEARED: 1, ROBOT_REINSTATED: 1, INPUT_REJECTED: 0, PLACEMENT_CONFLICT: 0, ROBOT_NOT_REPORTING: 0}
  order_results: {O-001: SHIPPED, O-002: SHIPPED, O-003: SHIPPED, O-004: SHIPPED, O-005: SHIPPED, O-006: SHIPPED, O-007: SHIPPED}
