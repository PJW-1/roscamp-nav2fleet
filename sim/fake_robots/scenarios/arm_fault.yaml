# 팔 고장 보류. arm_left이 O-001(A 4개)에서 매번 1개를 놓고 실패한다(count 3 = 재시도 한도 2 + 1).
# 세 번째 실패로 관제는 Pode를 격리하지 않고 HELD ARM_FAULT로 보고한다(3개 놓음).
# Pode는 작업대에 묶인 채 서 있고, central(가짜)이 force_ship_after_s 뒤 /fleet/force_ship을 부른다.
# 그러면 Pode가 출고로 가 교환하고 O-001은 PARTIAL(놓은 3개)로 끝난다.
# 묶인 Pode가 작업 도크를 쥐고 있어 O-002(arm_right 물건)는 강제 출고가 끝난 뒤에 채워진다.
#   O-001 A 4개, 3개 놓고 팔 고장     HELD(ARM_FAULT) 뒤 PARTIAL
#   O-002 C 1개                       SHIPPED
map: d2  # D2 배치용 시나리오(기본 배치는 v7)
seed: 31
speed_factor: 5.0
timeout_s: 900
stock: {arm_left: {A: 6, B: 6}, arm_right: {C: 6, D: 6}}
force_ship_after_s: 20
orders:
  - {at_s: 0, id: O-001, items: {A: 4}}
  - {at_s: 5, id: O-002, items: {C: 1}}
robots:
  pode1: {start: P-1, speed_scale: 1.0, pose_noise_m: 0.03}
  pode2: {start: P-2, speed_scale: 0.9, pose_noise_m: 0.03}
  pode3: {start: P-3, speed_scale: 1.0, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 1.0, error_cm: 1.0}
faults:
  - {at_s: 0, arm: arm_left, type: arm_fail, count: 3, after_items: 1}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다
  all_orders_finished: true
  orders_shipped: 1
  orders_partial: 1
  orders_held: 0
  orders_canceled: 0
  robots_isolated: 0
  fifo_violations: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  events_include: [FILL_RETRY, FILL_FAILED, ORDER_HELD, FORCE_SHIP, ORDER_PARTIAL]
  event_counts: {FILL_RETRY: 2, FILL_FAILED: 1, ORDER_HELD: 1, FORCE_SHIP: 1, ROBOT_ISOLATED: 0, ROBOT_NOT_REPORTING: 0}
  order_results: {O-001: PARTIAL, O-002: SHIPPED}
  hold_reasons: {O-001: ARM_FAULT}
