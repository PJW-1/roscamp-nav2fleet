# arm_left가 채움에 세 번 실패해 pode2의 O-001이 HELD ARM_FAULT가 된다.
# 60초에 운영자가 pode2를, 68초에 주문을 받은 pode1을 들어낸다. pode3이 나머지를 끝낸다.
# 작업셀이 취소 중(cancel_seconds)이면 매니저가 pode3의 목표를 쥐고 있어야 한다(먼저 보내면 FILL_RETRY).
map: d2  # D2 배치용 시나리오(기본 배치는 v7)
seed: 23
speed_factor: 5.0
timeout_s: 900
stock: {arm_left: {A: 6, B: 6}, arm_right: {C: 6, D: 6}}
orders:
  - {at_s: 0, id: O-001, items: {A: 2, C: 2}}
  - {at_s: 0, id: O-002, items: {B: 1, D: 1}}
  - {at_s: 10, id: O-003, items: {A: 2}}
  - {at_s: 20, id: O-004, items: {C: 1, D: 1}}
robots:
  pode1: {start: P-1, speed_scale: 1.0, pose_noise_m: 0.03}
  pode2: {start: P-2, speed_scale: 0.9, pose_noise_m: 0.03}
  pode3: {start: P-3, speed_scale: 1.0, pose_noise_m: 0.03}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0, cancel_seconds: 4.0}
dock: {duration_s: 1.0, error_cm: 1.0}
faults:
  - {at_s: 0, arm: arm_left, type: arm_fail, count: 3}
  - {at_s: 60, robot: pode2, type: operator_remove}
  - {at_s: 68, robot: pode1, type: operator_remove}
expect:
  robot_idle: null  # 고장 시나리오는 ROBOT_IDLE을 세지 않는다
  all_orders_finished: true
  orders_shipped: 4
  orders_partial: 0
  orders_held: 0
  fifo_violations: 0
  zone_holder_max: 1
  released_without_position_check: 0
  unheld_zone_pose: 0
  orders_canceled: 0
  robots_isolated: 0
  events_include: [FILL_RETRY, FILL_FAILED, ORDER_HELD, ZONES_CLEARED, ORDER_REQUEUED]
  # ORDER_REQUEUED 2: pode2, pode1 모두 격리 없이 치울 때 한 번씩
  event_counts: {FILL_RETRY: 2, FILL_FAILED: 1, ORDER_HELD: 1, ZONES_CLEARED: 2, ORDER_REQUEUED: 2, ROBOT_ISOLATED: 0, ROBOT_NOT_REPORTING: 0}
  order_results: {O-001: SHIPPED, O-002: SHIPPED, O-003: SHIPPED, O-004: SHIPPED}
  hold_reasons: {O-001: ARM_FAULT}
