# 팔 관제 합의 가짜 시스템 판 (d) 고장 없음: 담는 동안 ReportTrip FILLING placed가 1, 2, 3으로 오르고 출고
#   ros2 launch iponic_bringup pc.launch.py use_fake:=true monitor:=false scenario:=<이 파일>
#   python3 tools/arm_rules_gz.py --case d --out <결과 폴더>   (같은 ROS_DOMAIN_ID)
map: v7
seed: 11
speed_factor: 2.0  # 시험용으로 시계 2배
timeout_s: 900
stock: {arm_left: {A: 20, B: 20}, arm_right: {C: 20, D: 20}}
orders:
  - {at_s: 0, id: R-D, items: {A: 2, B: 1}}
robots:
  pode1: {start: P-1}
arm: {seconds_per_item: 2.5, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 1.0, error_cm: 1.0}
faults: []
