# 팔 관제 합의 Gazebo 판 (d) 고장 없음: 담는 동안 ReportTrip FILLING placed가 1, 2, 3으로 오르고 출고
#   ros2 launch fleet_gz_sim gz.launch.py layout:=v7 scenario:=<이 파일> sim_dock_stub:=true
#   python3 tools/arm_rules_gz.py --case d --out <결과 폴더>   (같은 ROS_DOMAIN_ID)
map: v7
seed: 11
timeout_s: 900
stock: {arm_left: {A: 20, B: 20}, arm_right: {C: 20, D: 20}}
orders:
  - {at_s: 0, id: R-D, items: {A: 2, B: 1}}
robots:
  pode1: {start: P-1}
arm: {seconds_per_item: 4.0, swap_seconds: 8.0, fail_rate: 0.0}
dock: {duration_s: 3.0, error_cm: 1.0}
faults: []
