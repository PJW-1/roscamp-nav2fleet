# RPP(FollowPathGoal)와 MPPI(FollowPathMPPI) 비교 묶음의 설정. 장애물의 크기, 속도, 길과 시나리오는 여기에만 둔다.
# 좌표는 map 틀(v7 경기장, 1.98 x 0.98 m)이다. 라이다 높이는 약 0.125 m라 모든 장애물을 0.20 m 이상으로 둔다.

world: arena
robot: pode1
controllers: [FollowPathGoal, FollowPathMPPI]  # 앞이 RPP(기본), 뒤가 MPPI
repeats: 10  # 시나리오마다 컨트롤러마다 이만큼. 순서는 ABBA(짝수면 두 컨트롤러가 먼저 도는 횟수가 같다)
leg_timeout_s: 90.0  # sim 초. 넘으면 실패로 적고 goal을 취소한다
flake_s: 3.0  # 이 sim 초 안에 움직이지도 않고 ABORTED면(planner 응답 20 ms 시간 초과 같은 Nav2 쪽 일) 한 번 다시 보낸다.
             # 다시 보낸 판은 기록에 retried로 남는다
settle_s: 2.0  # 선택을 바꾼 뒤와 장애물을 놓은 뒤 기다리는 sim 초
start: {x: 0.49, y: 0.625, yaw_deg: 110}  # O_IN. 잰 구간이 끝나면 RPP로 여기로 돌아온다(재지 않음)
goal: {x: 1.645, y: 0.55, yaw_deg: 0}  # M_E. 가운데 통로(HALL)를 지난다
park: {x: 5.0, y: 5.0}  # 쓰지 않는 장애물을 경기장 밖에 둔다(x는 장애물마다 0.5씩 더함)

# 판정
blocked_window_s: 10.0  # 이 시간 동안 실제 위치가 blocked_move_m보다 덜 움직이면 BLOCKED 한 번
blocked_move_m: 0.05  # pode_fsm blocked_after_s와 같은 10 s, progress checker와 같은 0.05 m
arrive_m: 0.10  # 성공은 Nav2 SUCCEEDED이면서 실제 위치가 goal에서 이 거리 안일 때(AMCL이 틀려도 속지 않게)
collision_m: 0.005  # 몸(local_costmap 다각형 발자국)과 장애물 면의 실제 거리가 이 값 이하면 충돌
doridori_deadband: 0.02  # rad/s. |wz|가 이보다 작은 명령은 부호 바꿈을 셀 때 건너뛴다
corridor_band: [0.404, 0.754]  # 가운데 통로의 y 범위(남쪽 진열대 위 ~ 진열대 A 아래). 계획 경로와 실제 궤적이 모두 이 안이면 "통로 판"
turn_wz: 0.3  # rad/s. vx가 0이고 |wz|가 이 이상인 명령 시간은 "제자리 회전"으로 센다(shim은 1.0 rad/s로 돈다)
start_tol_m: 0.03  # 판을 시작할 때 실제 위치가 출발점에서 이보다 멀면
start_tol_deg: 5.0  # 또는 방향이 이보다 틀어지면 Gazebo에서 출발점으로 옮기고 replaced로 남긴다(goal checker 0.05 m, 6.9°보다 좁게)

movers:
# 가운데 통로의 장애물은 진열대 A 남쪽 면(0.754)을 기준으로 둔다(면과의 거리를 그대로 지킨다)
  box:  # (b) 가만히 있는 상자. 통로 북쪽 절반에 두어 남쪽으로 0.19 m가 남는다
    shape: box
    size: [0.10, 0.10, 0.25]
    path: [[1.10, 0.644]]
    speed: 0.0
  person:  # (c) 사람 대역: 남쪽 진열대 틈을 가로질러 오간다
    shape: cylinder
    size: [0.04, 0.25]  # 반지름, 높이
    path: [[1.139, 0.28], [1.139, 0.684]]  # 북쪽 끝은 진열대 A 남쪽 면에서 3 cm 떨어진다
    speed: 0.10
  cart:  # (c) 카트 대역: 통로 북쪽 줄을 따라 천천히 오간다
    shape: box
    size: [0.14, 0.09, 0.20]
    path: [[0.80, 0.664], [1.45, 0.664]]
    speed: 0.06
  robot:  # (d) 마주 오는 로봇 대역: Pode 크기, 통로 북쪽 줄(y 0.684)로 서쪽으로 한 번 간다
    shape: box
    size: [0.12, 0.112, 0.20]
    path: [[1.62, 0.684], [0.50, 0.684]]
    speed: 0.12
    once: true  # 끝에 서 있는다(오가지 않는다)
    yield_m: 0.25  # 우리 로봇 중심과 이만큼 가까우면 멈춰 기다린다(충돌 검사로 서는 로봇처럼)

  e_box:  # (e) 통로 안 회피: 진열대 A에 붙인 작은 상자. 남쪽으로 0.30 m가 남게 두께를 0.04로 둔다
    shape: box
    size: [0.06, 0.04, 0.25]
    path: [[0.90, 0.729]]
    speed: 0.0
  e_cart:  # (e) 진열대 A 아래를 천천히 오가는 작은 카트. 남쪽 틈은 상자와 같다
    shape: box
    size: [0.10, 0.04, 0.20]
    path: [[1.15, 0.729], [1.45, 0.729]]
    speed: 0.05

scenarios:
  a_hall: []
  b_static: [box]
  c_moving: [person, cart]
  d_robot: [robot]
  e_corridor: [e_box, e_cart]
