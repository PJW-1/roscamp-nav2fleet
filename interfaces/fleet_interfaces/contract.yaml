# 이름, 타입, QoS의 유일한 기준. 코드는 `key`로 찾으므로 이름이나 QoS는 여기만 고친다.
# 사용자 기준이다(팀 레포에 올릴 첫 판). QoS depth는 실제 Wi-Fi에서 측정해야 한다.
version: 0.13-draft
# 0.13 (2026-11-13, nav2fleet, 기준(사용자), 추가 지시서 3의 7-4): 로봇단 교착 처리.
# MoveTo goal에 int32 priority(-1: 비었다)를, RobotStatus(/fleet/robots)에 같은 값 int32 priority를,
# RobotState에 string local_yield(wait/backup/retry, 아니면 빈 값)를 더했다. 핑키는 물체 앞에 서면
# RECOVERING으로 local_wait_s(2 s) 기다리고, 앞을 막은 것이 /fleet/robots의 다른 로봇이고 자기
# (priority, robot_id)가 더 작으면 지금 goal에서 지나온 길 안에서 local_backup_m(0.10 m)까지 물러난
# 뒤 다시 간다. 그래도 막히면 BLOCKED다. blocked_after_s(10 s, 0.12까지 nav_goal만 5 s)는 선 때부터
# BLOCKED까지의 상한이고 이 순서를 다 하고도 남는다. 관제는 RECOVERING 동안 막힘 시계를 쉬고(0.5와
# 같다) local_yield가 바뀔 때마다 사건 LOCAL_YIELD를 낸다. 관제의 비키기(HALL_YIELD, 규칙 7)는
# BLOCKED 뒤다. 핑키 계약 4절.
# 0.12 (2026-11-12, nav2fleet, 기준(사용자), 추가 지시서 3의 4절): 막힘 처리 보완.
# RobotState에 float64 obstacle_x, obstacle_y(map 좌표, 모르면 NaN), string obstacle_kind
# (unknown/person/object/robot, 지금은 unknown만. 비면 위치를 쓰지 않는다)를 더했다. 핑키는 BLOCKED일 때
# local costmap에서 가던 길 앞 obstacle_look_m(0.30 m) 안의 가장 가까운 장애물 칸으로 채운다.
# 서비스 /{pinky}/check_clear(fleet_interfaces/srv/CheckClear: x, y, r -> answer clear/blocked/unknown)
# 를 더했다. 관제가 막힘 표시의 점에서 check_range_m 안을 지나는 로봇에게 묻는다. 핑키 계약 4절.
# 0.11 (2026-11-12, nav2fleet, 기준(사용자)): MoveTo goal에 string mode를 더했다(MODE_FOLLOW_PATH
# "follow_path", MODE_NAV_GOAL "nav_goal", 비면 follow_path). nav_goal이면 핑키는 target_pose로
# /{pinky}/navigate_to_pose(Nav2 NavigateToPose)를 보내고 path와 final_goal은 쓰지 않는다.
# nav_goal에서는 blocked_after_s(5 s) 동안 진전이 없으면 BLOCKED이고, 복구는
# Nav2 기본 BT가 한다(R14는 follow_path에만). 핑키 계약 2절, 3절 7번, 4절.
# 같은 0.11에 order 모델(VDA 5050의 base와 horizon)을 더했다. 아직 push 전이라 판을 따로 올리지 않았다.
# 새 메시지 Segment(seq_id, mode, controller_id, path, target_pose, end_node_id, zone_ids). MoveTo
# goal에 order_id, order_update_id, stitch_node_id, base(Segment[]), horizon(Segment[]), feedback에
# last_done_seq_id, waiting_at_base_end, horizon_warning, 결과에 last_done_seq_id와 reason SUPERSEDED,
# ORDER_UPDATE_REJECTED. order_id가 비면 0.11 mode까지의 동작과 같다. 핑키 계약 2절 order 모델.
# 0.10은 일부러 건너뛰었다: 옛 레포의 다른 가지가 그 번호를 이 레포에 없는 장애물 보고에 썼다.
# 0.9 (2026-11-11, freefloor 가지, 기준(사용자)): 액션 /{pinky}/retreat(fleet_interfaces/action/Retreat).
# 개인 레포 main 계약 0.7의 Retreat(distance_m, speed_mps로 뒤로 곧게, Nav2 BackUp)에
# geometry_msgs/Pose[] path를 더했다. path가 있으면 핑키는 지나온 길을 거꾸로 적은 그 경로를 후진
# controller(FollowPathReverse, 0.05 m/s, 제자리 회전 없음)로 따른다. 결과 reason은 OBSTACLE_BEHIND,
# TIMEOUT, CANCELED, FAILED. 받으면 달리던 이동을 먼저 멈춘다(이동 goal은 CANCELED).
# main의 0.6(compute_path_to_pose)은 이 가지에 없다. 핑키 계약 3절 10번.
# +final_goal (2026-11-09, freefloor 가지, 기준(사용자)): 개인 레포 main 계약 0.8-draft의 MoveTo
# final_goal만 가져왔다. main의 0.6(compute_path_to_pose)과 0.7(retreat)은 이 가지에 없다.
# 0.8 (main, 2026-11-09, 기준(사용자)): MoveTo goal에 bool final_goal(기본 true)을 더했다. path 끝이 임무의
# 마지막 지점이 아니면(잠금 경계) 거짓이다. 핑키는 그때 끝까지 남은 거리 d로 속도를 √(2·a·d) 아래로
# 제한한다(nav2 speed_limit). 끝을 넘지 않는다는 규칙은 같다. FMS 개선 계획 버전 2 4절 horizon 최소판.
# 자유바닥(traffic_mode: freefloor)에서는 굴러가는 칸 잠금 끝에서 끝나는 MoveTo가 모두 거짓이다.
# 0.5 (2026-11-09, 제안): RobotState.state에 RECOVERING(핑키 FSM의 짧은 후진 자가 복구)을 더했다.
# 관제는 MOVING처럼 보되 막힘 시계와 멈춤 감시를 쉬고, SELF_RECOVERY와 SELF_RECOVERY_END를 낸다.
# /fleet/robots fault의 RECOVERING(관제가 로봇을 확인하는 중)과 이름만 같다. 핑키 계약 4절.
# 0.4 (2026-11-07, 제안): /fleet/heartbeat를 HEARTBEAT 프로필(reliable, depth 1)로 바꿨다.
# best_effort는 재전송이 없어 관제가 살아 있어도 Wi-Fi에서 3번 연달아 빠지면(1.5 s) 핑키가 선다.
# 끊김 판단은 그대로 앱 타이머(heartbeat_timeout_s, 벽시계)로 한다. 출처: Confluence
# 「VDA 5050(v3.0) 선례로 보는 다중 토픽 처리」 7.1절, FMS 개선 지시서 1.5, 핑키 FSM 구현 안내 2.3.
# MoveTo 결과 reason에 PATH_NOT_CONNECTED를 더했다(안내 2.2, 지시서 7.5).
# 0.3 (2026-11-06): 관제가 요구하는 heartbeat를 /fms/heartbeat에서 /fleet/heartbeat로 옮겼다.
# 나머지 이름, 필드, QoS는 그대로다. 0.3에 더하는 것은 모두 관제 요구(사용자 기준)다.

placeholders:
  pinky: [pinky1, pinky2, pinky3]
  arm: [arm1, arm2, arm3]

qos_profiles:
  STATE: {reliability: best_effort, durability: volatile, depth: 5}
  LATCHED: {reliability: reliable, durability: transient_local, depth: 1}
  EVENT: {reliability: reliable, durability: volatile, depth: 50}
  HEARTBEAT: {reliability: reliable, durability: volatile, depth: 1}

topics:
  # state에 BLOCKED(앞 물체로 섬), LOCALIZING(위치를 못 잡음)을 더했다. 필드는 그대로다.
  # RECOVERING(2026-11-09, 제안): 핑키 FSM이 쥔 구역 안에서 짧게 후진하고 다시 가는 자가 복구 중.
  # 0.13: local_yield(로봇단 교착 처리의 단계 wait/backup/retry). RECOVERING일 때만 채운다.
  # 상태는 변할 때만이 아니라 주기적으로(권장 10 Hz) 계속 발행한다. 하나를 잃어도 다음 값이 대신한다.
  - {key: robot_state, name: "/{pinky}/state", type: fleet_interfaces/msg/RobotState, qos: STATE}
  - {key: arm_state, name: "/{arm}/state", type: fleet_interfaces/msg/ArmState, qos: STATE}
  - {key: vision_items, name: "/{arm}/vision/items", type: fleet_interfaces/msg/ItemArray, qos: LATCHED, instances: {arm: [arm1, arm2]}}
  - {key: order_board, name: "/central/orders", type: fleet_interfaces/msg/OrderBoard, qos: LATCHED}
  - {key: assignments, name: "/fleet/assignments", type: fleet_interfaces/msg/AssignmentArray, qos: LATCHED}
  # 0.13: priority(마지막 MoveTo의 priority). 핑키가 구독해 앞을 막은 로봇과 누가 물러날지 정한다.
  - {key: robots, name: "/fleet/robots", type: fleet_interfaces/msg/RobotStatusArray, qos: LATCHED}
  # 관제 요구(사용자 기준). 로봇이 이 토픽을 못 들으면 끊긴 지 1.5 s에 정지 명령을 낸다(제동 거리는
  # 별도). 0.3 전에는 /fms/heartbeat였다.
  # 0.4부터 HEARTBEAT 프로필. 빠짐 자체가 정지 조건이라 재전송이 필요하다.
  - {key: heartbeat, name: "/fleet/heartbeat", type: std_msgs/msg/Header, qos: HEARTBEAT}
  - {key: zones, name: "/fleet/zones", type: fleet_interfaces/msg/ZoneStateArray, qos: LATCHED}
  - {key: events, name: "/central/events", type: fleet_interfaces/msg/FleetEvent, qos: EVENT}

actions:
  # 결과 reason에 HEARTBEAT_LOST(heartbeat가 끊겨 스스로 섬)를 더했다.
  # 0.4: 결과 reason에 PATH_NOT_CONNECTED(path가 로봇 위치를 지나지 않음)를 더했다(제안).
  # goal에 path(레인 폴리라인, geometry_msgs/Pose[])를 더했다(11-06 지시서 7번). 비면 점 목표다.
  # 0.11(제안): goal에 mode(follow_path | nav_goal, 비면 follow_path)를 더했다.
  # 0.11(제안): order 모델 칸(order_id, base, horizon 등). order_id가 비면 쓰지 않는다.
  # 0.11: order의 통신 끊김은 로봇 파라미터 comm_loss_policy(stop 기본 | base_end)가 정한다.
  # 0.13: goal에 priority(로봇단 교착 처리, -1이면 비었다).
  #       끊김은 /fleet/heartbeat가 heartbeat_timeout_s 동안 오지 않는 것으로 안다. 칸은 그대로다.
  - {key: move_to, name: "/{pinky}/move_to", type: fleet_interfaces/action/MoveTo}
  - {key: dock, name: "/{pinky}/dock", type: fleet_interfaces/action/Dock}
  # 작업 팔 두 대가 액션 하나를 쓴다. 바구니 공간 분담은 팔 팀이 정한다.
  - {key: fill_basket, name: "/workcell/fill_basket", type: fleet_interfaces/action/FillBasket}
  - {key: swap_basket, name: "/{arm}/swap_basket", type: fleet_interfaces/action/SwapBasket, instances: {arm: [arm3]}}
  # 실물 로봇에만 있어서 가짜 로봇 검사는 건너뛴다. 0.11부터 MoveTo mode nav_goal에서 핑키가 부른다.
  - {key: navigate_to_pose, name: "/{pinky}/navigate_to_pose", type: nav2_msgs/action/NavigateToPose, real_only: true}
  # path 모드에서 핑키가 레인 폴리라인을 따를 때 쓴다. 관제는 부르지 않는다.
  - {key: follow_path, name: "/{pinky}/follow_path", type: nav2_msgs/action/FollowPath, real_only: true}
  # 0.9(제안): 관제가 시키는 물러나기. 이동 goal을 대신한다. path가 있으면 그 경로를 후진으로 따른다.
  - {key: retreat, name: "/{pinky}/retreat", type: fleet_interfaces/action/Retreat}

services:
  - {key: set_run_mode, name: "/central/set_run_mode", type: fleet_interfaces/srv/SetRunMode}
  - {key: submit_order, name: "/central/submit_order", type: fleet_interfaces/srv/SubmitOrder}
  - {key: report_order, name: "/central/report_order", type: fleet_interfaces/srv/ReportOrder}
  # 관제 요구(사용자 기준): 응답에 string reason(거부 이유)을 더했다. 이름과 기존 필드는 그대로다.
  - {key: confirm_clear, name: "/fleet/confirm_clear", type: fleet_interfaces/srv/ConfirmClear}
  # 관제 요구(사용자 기준): 치운 로봇을 다시 투입한다. basket은 EMPTY 또는 NONE.
  - {key: reinstate, name: "/fleet/reinstate", type: fleet_interfaces/srv/Reinstate}
  # 0.12(기준(사용자)): 관제가 막힘 표시의 점 둘레가 비었는지 핑키에게 묻는다. 핑키 노드(pinky_fsm)가
  # 둔다. 가짜 핑키(fake_pinky_node)에는 없다: 관제는 서비스가 없으면 unknown으로 본다.
  - {key: check_clear, name: "/{pinky}/check_clear", type: fleet_interfaces/srv/CheckClear, real_only: true}
