# 스캔 거르개(추가지시서3 7-2, 기준(사용자)): 좁은 띠 안에서 벽·진열대에 붙은 라이다 점을 지운 스캔.
# launch/nav2.launch.py가 인자 narrow_strips가 비어 있지 않을 때만 이 파일을 nav2_params.yaml 위에
# 덧붙이고 pinky_scan_filter 노드를 띄운다. 비면(기본) 아무것도 바뀌지 않는다.
#
# - 두 costmap의 장애물 층만 거른 스캔을 읽는다. AMCL은 원래 scan을 그대로 읽는다.
# - 대가: 좁은 띠 안에서 벽에 붙은 wall_band_m보다 얇은 물체는 보이지 않는다.
# - fleet_gz_sim은 좁은 띠 뒤에 진열대 끝면마다 끝면을 wall_band_m만큼 사방으로 넓힌 작은 상자를
#   더해 준다(fleet_setup.shelf_end_boxes). 끝면 잡음이 띠 바로 밖에 떨어져 후진 모퉁이를 막았기
#   때문이다. 대가: 그 상자 안, 진열대 끝 둘레 wall_band_m(5 cm) 안의 얇은 물체도 보이지 않는다.
# - inf_is_valid: 거르개가 지운 빔은 inf다. Nav2 obstacle layer는 이 값이 꺼져 있으면 inf 빔을 버려,
#   띠 안에 한 번 찍힌 칸(잡음, 지나간 다른 로봇의 몸)이 그 빔으로 지워지지 않고 남는다(세 대 경기
#   l3g1: 앞서 J_E를 지나간 로봇이 남긴 칸 앞에서 격리). 켜면 inf를 range_max - 0.1 mm로 바꿔 그 빔을
#   따라 칸을 지운다. 찍는 일은 obstacle_max_range(2.5 m)보다 먼 점이라 하지 않는다. 라이다 range_max가
#   2.5 m보다 넉넉히 커야 한다(시뮬레이션 12 m, 실제 핑키의 sllidar 값은 확인하지 않았다). 짧으면 지운
#   빔의 끝이 가짜 장애물로 찍힌다. 지우기는 raytrace_max_range(3 m)까지다. 3 m까지 지우려면 range_max도
#   raytrace_max_range(3.0 m)보다 커야 한다(작으면 range_max까지만 지운다).
#   대가: 거른 빔이 지나는 길 위(벽 띠 안)에 서 있는 실제 장애물이나 다른 로봇의 칸도 지워질 수 있다.
#   또 그 빔은 벽·진열대 너머까지 칸을 지우므로, 진열대 뒤에 있던(지금은 가려 안 보이는) 장애물 칸도
#   지워질 수 있다. 다음 스캔에 보이는 것은 다시 찍힌다. 전역 costmap의 static layer 벽은 지워지지 않는다.

local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          topic: <robot_namespace>/scan_filtered
          inf_is_valid: true

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        scan:
          topic: <robot_namespace>/scan_filtered
          inf_is_valid: true
