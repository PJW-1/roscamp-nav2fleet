# 비전 장애물 자리(제안, 팀 합의 전, docs/회피_약속.md): 카메라가 본 장애물을 costmap 장애물 층에 넣는다.
# launch/nav2.launch.py가 인자 vision_obstacles:=true일 때만 이 파일을 nav2_params.yaml 위에 덧붙인다.
# 기본은 꺼짐이고, 꺼져 있으면 아무것도 바뀌지 않는다.
#
# - 토픽: /<로봇>/vision_obstacles (sensor_msgs/PointCloud2). 보내는 쪽은 회피 담당이 만든다.
# - 표시만 한다(marking). 찍힌 칸은 시간이 지나도 저절로 지워지지 않고, 라이다 광선이 그 칸을
#   지나갈 때만 지워진다. 라이다 광선이 닿지 않는 칸의 표시는 costmap을 비울 때까지 남는다.
#   observation_persistence는 받은 점을 버퍼에 두는 시간일 뿐이다.
# - expected_update_rate 0: 토픽이 조용해도 costmap이 멈추지 않는다.
# - 아래 값(거리, 높이, 남는 시간)은 자리만 잡은 것이다. 회피 담당이 정한다.

local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: scan vision
        vision:
          topic: <robot_namespace>/vision_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: scan vision
        vision:
          topic: <robot_namespace>/vision_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.5
