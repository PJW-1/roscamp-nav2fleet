# 핑키 한 대의 Nav2 설정. launch/nav2.launch.py가 로봇 namespace(/pinky1 등) 안에 띄운다.
#
# 출발점: 제조사 pinky_navigation/params/nav2_params.yaml(pinky_pro 014a09f) 위에
# 핑키_제어파트_전달사항_2026-11-06의 nav2_overrides 값(0.33 m 통로 Gazebo 연구)을 덮었다.
# 제조사 값과 다른 줄에는 이유를 적었다. 실제 지도에서 다시 맞춘다.
#
# <robot_namespace>는 launch가 "/pinky1"처럼 바꾼다. Jazzy costmap 층은 상대 토픽을
# costmap 노드 안(/pinky1/local_costmap/scan)으로 풀기 때문에 절대 이름을 쓴다.
# 노드 이름 키는 launch가 RewrittenYaml(root_key=namespace)로 namespace 아래에 넣는다.

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.05  # 전달사항 nav2_overrides(제조사 0.2). 1 cm 지도에 맞춘 값
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map_fine  # R15: AMCL만 1 cm 지도를 읽는다(costmap은 5 cm 지도 map)
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}  # launch 인자로 덮는다

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map
    yaml_filename: ""  # launch 인자 map

map_server_fine:
  ros__parameters:
    topic_name: map_fine
    frame_id: map
    yaml_filename: ""  # launch 인자 map_fine

# 계약의 navigate_to_pose. pinky_fsm은 MoveTo mode nav_goal(계약 0.11-draft 제안)일 때 이것을
# 부르고, follow_path일 때는 controller의 follow_path를 바로 부른다. BT는 launch가
# bt/navigate_to_pose_w_replanning_and_recovery_goal.xml(Nav2 기본 BT, controller만 FollowPathGoal)로
# 준다. 복구(Spin, Wait, BackUp, 지도 지우기)는 nav_goal에서만 허용한다(사용자 결정 2026-11-12)
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # navigate_through_poses는 띄우지 않는다(pinky_fsm이 부르지 않는다)
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0  # 전달사항(제조사 0.3)
    odom_topic: odom
    # 안내 3절: 버전 2에서 관제가 /{pinky}/speed_limit로 로봇별 속도 제한을 보낸다. 지우지 않는다
    speed_limit_topic: speed_limit
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker", "retreat_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathThrough", "FollowPathReverse", "FollowPathGoal"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05  # 전달사항(제조사 0.5)
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # R4: 관제 도착 허용치 0.15 m보다 작게(제조사 0.25)
      yaw_goal_tolerance: 0.12  # 전달사항(제조사 0.25)
    # 추가 지시서 3의 2-1: 후진(FollowPathReverse)은 제자리에서 방향을 고칠 수 없으니 끝 방향을 보지
    # 않는다(pi보다 큰 허용치). 후진은 마당 지점에서 끝나고 다음 움직임은 Nav2 goal이다.
    # pinky_fsm reverse_goal_checker_id가 이 이름을 쓴다.
    retreat_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.2
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25  # 전달사항(제조사 0.2)
      # 추가 지시서 3의 2-1 3번: 앞보기 0.10 m 고정(제조사 0.6, 전달사항 0.15 속도 비례). 속도 비례
      # 앞보기(0.12 m/s에서 0.18 m)는 모퉁이 9 cm 앞에서 돌기 시작했다(작업 기록 4.2)
      lookahead_dist: 0.10
      min_lookahead_dist: 0.10  # 전달사항(제조사 0.3). 속도 비례를 끄면 쓰지 않는다
      max_lookahead_dist: 0.25  # 전달사항(제조사 0.9). 속도 비례를 끄면 쓰지 않는다
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6  # 전달사항(제조사 1.0)
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      # use_rotate_to_heading과 allow_reversing은 함께 켤 수 없어 후진은 BackUp으로 한다(안내 3절).
      # 추가 지시서 3의 2-1: 0.70(R12의 0.25에서 올림). pinky_fsm이 꺾이는 곳을 반지름 0.10 m 호로
      # 보내므로 호 위의 앞보기 점은 asin(0.10 / 0.20) = 0.52 rad 옆에 있다. 0.25면 호 위에서 서서
      # 돌기를 되풀이한다. R12의 0.8(충돌 경고 717건)은 꺾인 선을 곡선으로 질러 가던 때의 값이다.
      # 선의 시작에서 0.70보다 많이 어긋나면 지금처럼 서서 돈다(넓은 구역에서만 일어난다)
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      # 0.05 (user, 2026-11-10; was 0.6): RPP reads d >= the 0.06 m inscribed radius until the
      # robot touches, so 1.5 * d / 0.05 > 1 and a box beside the path no longer pins the robot
      # to regulated_linear_scaling_min_speed (0.05 m/s) inside the 0.15 m inflation
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2
    # Paths that end at a 0.5 m lock boundary (MoveTo.final_goal false, pinky_fsm
    # through_controller_id). The path is re-sent every ~0.1 m, so FollowPath's 0.6 m approach
    # slow-down would never end; pinky_fsm's speed limit stops it at the boundary instead.
    # Jazzy RPP always applies the approach constraint, so the distance is cut to 0.05 m.
    # An explicit copy of FollowPath (keep every other key equal; test_nav_config checks it)
    FollowPathThrough:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25  # 전달사항(제조사 0.2)
      # 추가 지시서 3의 2-1 3번: 앞보기 0.10 m 고정(제조사 0.6, 전달사항 0.15 속도 비례). 속도 비례
      # 앞보기(0.12 m/s에서 0.18 m)는 모퉁이 9 cm 앞에서 돌기 시작했다(작업 기록 4.2)
      lookahead_dist: 0.10
      min_lookahead_dist: 0.10  # 전달사항(제조사 0.3). 속도 비례를 끄면 쓰지 않는다
      max_lookahead_dist: 0.25  # 전달사항(제조사 0.9). 속도 비례를 끄면 쓰지 않는다
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.05  # the only difference from FollowPath
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6  # 전달사항(제조사 1.0)
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      # use_rotate_to_heading과 allow_reversing은 함께 켤 수 없어 후진은 BackUp으로 한다(안내 3절).
      # 추가 지시서 3의 2-1: 0.70(R12의 0.25에서 올림). pinky_fsm이 꺾이는 곳을 반지름 0.10 m 호로
      # 보내므로 호 위의 앞보기 점은 asin(0.10 / 0.20) = 0.52 rad 옆에 있다. 0.25면 호 위에서 서서
      # 돌기를 되풀이한다. R12의 0.8(충돌 경고 717건)은 꺾인 선을 곡선으로 질러 가던 때의 값이다.
      # 선의 시작에서 0.70보다 많이 어긋나면 지금처럼 서서 돈다(넓은 구역에서만 일어난다)
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2

    # Retreat with a path (계약, 사용자 기준): pinky_fsm sends the driven way reversed here
    # (pinky_fsm reverse_controller_id). RPP drives backwards when the carrot is behind the robot
    # (allow_reversing), and the collision check looks along that motion, so something behind
    # stops it (FollowPath NO_VALID_CONTROL -> Retreat OBSTACLE_BEHIND). It stays loaded in every
    # configuration. An explicit copy of FollowPath: only desired_linear_vel,
    # use_rotate_to_heading and allow_reversing differ (test_nav_config checks it)
    FollowPathReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.05  # 물러나기는 천천히(제안)
      # 추가 지시서 3의 2-1 3번: 앞보기 0.10 m 고정(제조사 0.6, 전달사항 0.15 속도 비례). 속도 비례
      # 앞보기(0.12 m/s에서 0.18 m)는 모퉁이 9 cm 앞에서 돌기 시작했다(작업 기록 4.2)
      lookahead_dist: 0.10
      min_lookahead_dist: 0.10  # 전달사항(제조사 0.3). 속도 비례를 끄면 쓰지 않는다
      max_lookahead_dist: 0.25  # 전달사항(제조사 0.9). 속도 비례를 끄면 쓰지 않는다
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6  # 전달사항(제조사 1.0)
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      # use_rotate_to_heading과 allow_reversing은 함께 켤 수 없다. 후진 controller라 제자리 회전을
      # 끄고 후진을 켠다: 지나온 길을 거꾸로 적은 경로를 돌지 않고 뒤로 따른다
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_min_angle: 0.70  # 쓰지 않는다. FollowPath와 같게 둔다
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2

    # Nav2 goals (MoveTo mode nav_goal, 계약 0.11-draft 제안): the NavigateToPose tree drives with
    # this controller. Only the name is fixed; a teammate may swap in MPPI or DWB. It starts as an
    # exact copy of FollowPath (RPP, collision check on; test_nav_config checks it)
    FollowPathGoal:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25  # 전달사항(제조사 0.2)
      lookahead_dist: 0.15  # 전달사항(제조사 0.6)
      min_lookahead_dist: 0.10  # 전달사항(제조사 0.3)
      max_lookahead_dist: 0.25  # 전달사항(제조사 0.9)
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6  # 전달사항(제조사 1.0)
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.25
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 1.4875
      cost_scaling_dist: 0.05
      cost_scaling_gain: 1.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025  # 전달사항(제조사 0.05)
      # 추가 지시서 3의 2-1 2번: 사각형 0.12 x 0.12 m 대신 몸 모양에 가까운 다각형(base_footprint 틀).
      # pinky_description base_link 충돌 메시의 바닥 윤곽(x -0.0745~0.0387, y -0.041~0.047)과 바퀴
      # (x ±0.028, y ±0.055)를 1~2 mm 넉넉히 덮는다. 회전 중심(바퀴 축)이 앞쪽이라 뒤 모서리까지
      # 0.0845 m다. FollowPath 셋의 충돌 검사와 pinky_fsm의 막힘 판단이 이 발자국을 쓴다
      footprint: "[[0.040, 0.021], [0.036, 0.031], [0.029, 0.056], [-0.029, 0.056], [-0.049, 0.049], [-0.071, 0.042], [-0.076, 0.037], [-0.076, -0.037], [-0.071, -0.042], [-0.049, -0.049], [-0.029, -0.056], [0.029, -0.056], [0.036, -0.031], [0.040, -0.021]]"
      # 제조사는 voxel_layer. 라이다가 2D라 같은 일을 하는 obstacle_layer로 쓴다
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: <robot_namespace>/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      # pinky_fsm이 local_costmap/costmap(OccupancyGrid) 전체를 받아 BLOCKED를 판단한다
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # 사각형 그대로 둔다(추가 지시서 3의 2-1 가정): NavFn은 점으로 계획하고 이 발자국은 inscribed
      # 반지름으로만 쓴다. 바꾸면 마당 Nav2 goal 경로가 벽에 더 붙는다
      footprint: "[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]"
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      # 안내 3절: 버전 2 우회 경로 계산을 위해 라이다 장애물 층을 둔다
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: <robot_namespace>/map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: <robot_namespace>/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
      # Nav2 goal 경로(NavFn)만 쓴다. local costmap(FollowPath, BLOCKED 판단)은 0.15/3.0 그대로다.
      # 0.25/6.0(2026-11-12): 벽 칸에서 0.20 m 떨어진 칸도 값이 있어 넓은 마당에서는 경로가 벽,
      # 진열대, 라이다에 보인 다른 핑키에서 약 0.25 m 떨어져 간다. 0.38 m 통로(5 cm 지도에서 빈 칸
      # 6~7개)에서도 가운데 칸은 INSCRIBED(253)보다 낮아(약 140~180) 길이 나오고 가운데가 가장
      # 싸다. NavFn은 점으로 계획하므로 몸(0.12 m + padding 0.03 m)은 INSCRIBED 반지름 0.09 m로만
      # 본다. 제자리 회전 반지름 0.083 m도 그 안이다. test_nav_config가 두 경우를 계산해 본다
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.25
      always_send_full_costmap: true
      # keepout(급행, 도크 구역)은 launch 인자 keepout_mask가 있을 때만 params/keepout.yaml로 더한다

# 안내 3절: 관제가 /{pinky}/compute_path_to_pose, /{pinky}/is_path_valid를 부를 수 있게 띄워 둔다
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# backup: pinky_fsm의 자가 복구와 Retreat(follow_path 쪽). spin, wait, backup: NavigateToPose BT의
# 복구(nav_goal 쪽에서만, 사용자 결정 2026-11-12. R14는 follow_path에만 남는다)
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false
